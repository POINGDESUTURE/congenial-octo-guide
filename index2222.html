    <script>
      function showLoginModal() {
        const modal = new bootstrap.Modal(document.getElementById('loginModal'));
        modal.show();
        document.getElementById('loginError')?.classList.add('hidden');
      }
      function showSignupModal() {
        const modal = new bootstrap.Modal(document.getElementById('signupModal'));
        modal.show();
        document.getElementById('signupError')?.classList.add('hidden');
      }
      function logout() {
        if (confirm("Voulez-vous vous déconnecter ?")) {
          if (typeof auth !== 'undefined') auth.signOut().catch(console.error);
        }
      }

    <script>
        // =============================================
        // CONFIGURATION FIREBASE
        // =============================================
        const firebaseConfig = {
            apiKey: "AIzaSyAGN9ncsAXA6zOQF9euLL69YTX0yKjADV4",
            authDomain: "medicomed.firebaseapp.com",
            projectId: "medicomed",
            storageBucket: "medicomed.firebasestorage.app",
            messagingSenderId: "653914992834",
            appId: "1:653914992834:web:88bc3797fe83ef7c6d4b5b"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(app);
        const db = firebase.firestore(app);

        db.settings({
            cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED,
            merge: true
        });

        // =============================================
        // VARIABLES GLOBALES
        // =============================================
        let data = {};
        let allQcmsIndex = {};
        let currentPath = [];
        let currentSession = [];
        let missedAnswers = [];
        let sessionValidated = false;
        let examMode = false;
        let dpMode = false;
        let examEndTime = null;
        let examTimerInterval = null;
        let dpValidated = [];
        let currentUser = null;
        const sessionConfidence = {};
        let sessionStartTime = null;
        let questionStartTimes = {};
        let currentQuestionIndex = null;

        // =============================================
        // FONCTION BARÈME EDN DE NOTATION
        // =============================================
        function calculateEDNPoints(userAnswers, qcmOptions) {
            const canceledItems = getCanceledItems();
            let errors = 0;

            qcmOptions.forEach((opt, idx) => {
                if (canceledItems.includes(opt.id)) return; // Ne pas compter les items annulés
                
                const isUserChecked = userAnswers.includes(idx);
                const isCorrect = opt.isCorrect;
                
                if (isUserChecked !== isCorrect) {
                    errors++;
                }
            });

            if (errors === 0) return 1.0;
            if (errors === 1) return 0.5;
            if (errors === 2) return 0.2;
            return 0.0;
        }

        // =============================================
        // FONCTIONS D'AUTHENTIFICATION
        // =============================================
        function showLoginModal() {
            const modalEl = document.getElementById('loginModal');
            if (modalEl) {
                const modal = new bootstrap.Modal(modalEl);
                modal.show();
                const errorEl = document.getElementById('loginError');
                if (errorEl) errorEl.classList.add('hidden');
            }
        }

        function showSignupModal() {
            const modalEl = document.getElementById('signupModal');
            if (modalEl) {
                const modal = new bootstrap.Modal(modalEl);
                modal.show();
                const errorEl = document.getElementById('signupError');
                if (errorEl) errorEl.classList.add('hidden');
            }
        }

        async function loginWithModal() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorContainer = document.getElementById('loginError');

            if (!email || !password) {
                errorContainer.textContent = "Veuillez remplir tous les champs.";
                errorContainer.classList.remove('hidden');
                return;
            }

            try {
                await auth.signInWithEmailAndPassword(email, password);
                bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
                document.getElementById('loginForm').reset();
            } catch (error) {
                console.error("Erreur de connexion :", error);
                errorContainer.textContent = getFirebaseAuthErrorMessage(error.code);
                errorContainer.classList.remove('hidden');
            }
        }

        async function signupWithModal() {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const errorContainer = document.getElementById('signupError');

            if (!email || !password) {
                errorContainer.textContent = "Veuillez remplir tous les champs.";
                errorContainer.classList.remove('hidden');
                return;
            }

            if (password.length < 6) {
                errorContainer.textContent = "Le mot de passe doit contenir au moins 6 caractères.";
                errorContainer.classList.remove('hidden');
                return;
            }

            try {
                await auth.createUserWithEmailAndPassword(email, password);
                bootstrap.Modal.getInstance(document.getElementById('signupModal')).hide();
                document.getElementById('signupForm').reset();
                alert("Compte créé avec succès ! Bienvenue sur QCM Médecine.");
            } catch (error) {
                console.error("Erreur d'inscription :", error);
                errorContainer.textContent = getFirebaseAuthErrorMessage(error.code);
                errorContainer.classList.remove('hidden');
            }
        }

        function logout() {
            if (confirm("Voulez-vous vous déconnecter ? Vos données locales seront conservées.")) {
                auth.signOut().catch(error => {
                    console.error("Erreur de déconnexion :", error);
                });
            }
        }

        function getFirebaseAuthErrorMessage(errorCode) {
            const messages = {
                'auth/user-not-found': 'Aucun compte trouvé avec cet email.',
                'auth/wrong-password': 'Mot de passe incorrect.',
                'auth/email-already-in-use': 'Un compte existe déjà avec cet email.',

        async function syncLocalToCloud() {
            if (!currentUser) return;

            const userId = currentUser.uid;
            const batch = db.batch();

            try {
                const localAttempts = JSON.parse(localStorage.getItem('qcm_attempts_log') || '[]');
                if (localAttempts.length > 0) {
                    const cloudAttemptsSnapshot = await db.collection(`users/${userId}/qcmAttempts`).get();
                    const cloudAttempts = cloudAttemptsSnapshot.docs.map(doc => doc.data());

                    const newAttempts = localAttempts.filter(local => {
                        return !cloudAttempts.some(cloud =>
                            cloud.qcmId === local.qcmId && cloud.date === local.date && cloud.timestamp === local.timestamp
                        );
                    });

                    newAttempts.forEach(attempt => {
                        const docRef = db.collection(`users/${userId}/qcmAttempts`).doc();
                        batch.set(docRef, {
                            ...attempt,
                            userId: userId,
                            syncedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });
                }

                const localErrorLog = JSON.parse(localStorage.getItem('digital_error_log') || '{}');
                if (Object.keys(localErrorLog).length > 0) {
                    const cloudErrorLogSnapshot = await db.collection(`users/${userId}/errorLog`).get();
                    const cloudErrorLog = {};
                    cloudErrorLogSnapshot.forEach(doc => {
                        cloudErrorLog[doc.data().key] = doc.data();
                    });

                    Object.entries(localErrorLog).forEach(([key, value]) => {
                        if (!cloudErrorLog[key] || JSON.stringify(cloudErrorLog[key]) !== JSON.stringify(value)) {
                            const docRef = db.collection(`users/${userId}/errorLog`).doc(key);
                            batch.set(docRef, {
                                ...value,
                                key: key,
                                userId: userId,
                                syncedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                    });
                }

                const localCanceledQcms = JSON.parse(localStorage.getItem('canceled_qcms') || '[]');
                const localCanceledItems = JSON.parse(localStorage.getItem('canceled_items') || '[]');

                if (localCanceledQcms.length > 0 || localCanceledItems.length > 0) {
                    const metadataRef = db.collection(`users/${userId}/metadata`).doc('canceled');
                    batch.set(metadataRef, {
                        canceledQcms: localCanceledQcms,
                        canceledItems: localCanceledItems,
                        userId: userId,
                        syncedAt: firebase.firestore.FieldValue.serverTimestamp()

                }

                const preferences = {
                    examTimerCollapsed: localStorage.getItem('examTimerCollapsed') || '0',
                    theme: localStorage.getItem('theme') || 'light'

                const preferencesRef = db.collection(`users/${userId}/metadata`).doc('preferences');

                    syncedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                await batch.commit();
                localStorage.setItem('lastSync', new Date().toISOString());

                console.error("❌ Erreur de synchronisation :", error);
            }

        function mergeAttempts(localAttempts, cloudAttempts) {
            const merged = [...localAttempts];
            const mergedIds = new Set(localAttempts.map(a => `${a.qcmId}-${a.timestamp || a.date}`));

            cloudAttempts.forEach(cloud => {
                const id = `${cloud.qcmId}-${cloud.timestamp || cloud.date}`;
                if (!mergedIds.has(id)) {
                    merged.push(cloud);
                    mergedIds.add(id);
                }
            });

            merged.sort((a, b) => {
                const aTime = new Date(a.timestamp || a.date).getTime();
                const bTime = new Date(b.timestamp || b.date).getTime();
                return bTime - aTime;
            });

            const MAX_ATTEMPTS_LOG = 5000;
            if (merged.length > MAX_ATTEMPTS_LOG) {
                merged.splice(MAX_ATTEMPTS_LOG);
            }

            return merged;
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getQcmStats(qcmId) {
            const attempts = getAttemptsLog().filter(a => a.qcmId === qcmId);
            if (attempts.length === 0) return { label: 'Jamais vu', cls: 'secondary' };

            const lastTwo = attempts.slice(-2);
            const masteredRecently = lastTwo.length >= 2 && lastTwo.every(a => a.correct);
            const errorCount = attempts.filter(a => !a.correct).length;

            if (masteredRecently) return { label: 'Maîtrisé', cls: 'success' };
            if (errorCount >= 2) return { label: 'Erreur récurrente', cls: 'danger' };
            return { label: `Vu ${attempts.length}×`, cls: 'info' };
        }

        function computeGlobalStats() {
            const log = getAttemptsLog();
            const total = log.length;
            if (total === 0) return null;

            const successCount = log.filter(a => a.correct).length;
            const successRate = (successCount / total * 100).toFixed(1);

            const byConf = { sure: [], hesitant: [], guess: [] };
            log.forEach(a => {
                if (a.confidence && byConf[a.confidence]) byConf[a.confidence].push(a.correct);
            });
            const rateOf = key => {
                const arr = byConf[key];
                if (arr.length === 0) return null;
                return (arr.filter(Boolean).length / arr.length * 100).toFixed(0);
            };

            return {
                total,
                successRate,
                sureRate: rateOf('sure'),
                hesitantRate: rateOf('hesitant'),
                guessRate: rateOf('guess'),
                falseCertaintyCount: byConf.sure.filter(c => !c).length
            };
        }

                    fp: 0,
                    fn: 0,
                    examErrorCount: 0,
                    confidence: sessionConfidence[qcmId] || 'non spécifié'

            if (status === 'false_positive') {
                log[key].fp += 1;
                if (isExam) log[key].examErrorCount = (log[key].examErrorCount || 0) + 1;
            } else if (status === 'false_negative') {
                log[key].fn += 1;
                if (isExam) log[key].examErrorCount = (log[key].examErrorCount || 0) + 1;
            }

            if (sessionConfidence[qcmId]) log[key].confidence = sessionConfidence[qcmId];

        async function loadNode(node, pathParts) {
            if (Array.isArray(node)) {
                const chapters = {};
                for (const file of node) {
                    try {
                        const res = await fetch(`QCM/${pathParts.join('/')}/${file}`);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const text = await res.text();
                        const parsed = parseQCMFile(text, pathParts.join(' > '), file);
                        if (parsed.length > 0) {
                            chapters[file.replace('.txt', '').replace(/_/g, ' ')] = parsed;
                        }
                    } catch (e) {
                        console.error(`Erreur chargement fichier: QCM/${pathParts.join('/')}/${file}`, e);
                    }
                }
                return chapters;
            } else {
                const sousDossiers = {};
                for (const key in node) {
                    sousDossiers[key] = await loadNode(node[key], [...pathParts, key]);
                }
                return sousDossiers;
            }
        }

            const loadingEl = document.getElementById('loadingScreen');

        function getNode(path) {
            let node = data;
            for (const key of path) node = node[key];
            return node;
        }

        function buildFlatIndex(node) {
            if (Array.isArray(node)) {
                node.forEach(q => { allQcmsIndex[q.id] = q; });
            } else {
                Object.values(node).forEach(child => buildFlatIndex(child));
            }
        }

        function parseQCMFile(content, currentSubjectPath, filename) {
            const qcms = [];
            const blocks = content.replace(/\r/g, '').split(/\n\s*\n+/).filter(b => b.trim());

            blocks.forEach((block, index) => {
                const lines = block.trim().split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length < 6) return;

                let question = lines[0];
                if (question.includes('{') || question.includes(';') || question.includes('<')) return;

                let imagePath = null;
                let optionStartIndex = 1;

                if (lines[1] && lines[1].toUpperCase().startsWith('IMG:')) {
                    imagePath = lines[1].substring(4).trim();
                    optionStartIndex = 2;
                }

                const options = [];
                const optionRegex = /^(\$?)([A-Ea-e])[\.\)]\s+(.+)$/;

                for (let i = optionStartIndex; i < lines.length; i++) {
                    const match = lines[i].match(optionRegex);
                    if (match) {
                        const text = match[3];
                        const itemId = generateCleanId(`${currentSubjectPath}_${question}_${text}`);
                        options.push({ id: itemId, text: text, isCorrect: match[1] === '$' });
                    }
                }

                if (options.length === 5) {
                    const qcmId = generateCleanId(`${currentSubjectPath}_${question}`);
                    qcms.push({ id: qcmId, subjectPath: currentSubjectPath, question, image: imagePath, options });
                }
            });
            return qcms;
        }

        function startQuestionTimer(qIdx) {
            currentQuestionIndex = qIdx;
            questionStartTimes[qIdx] = Date.now();
        }

        function stopQuestionTimer(qIdx) {
            if (questionStartTimes[qIdx]) {
                const endTime = Date.now();
                const duration = (endTime - questionStartTimes[qIdx]) / 1000;

                if (!sessionConfidence[currentSession[qIdx].id]) {
                    sessionConfidence[currentSession[qIdx].id] = {};
                }
                sessionConfidence[currentSession[qIdx].id].duration = duration;
                delete questionStartTimes[qIdx];
            }
        }

        function clearExamTimer() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            examTimerInterval = null;
            examEndTime = null;
            hideExamTimerWidget();
        }

        function hideExamTimerWidget() {
            const widget = document.getElementById('examTimerWidget');
            if (widget) widget.classList.add('hidden');
        }

        function toggleExamTimerCollapse() {
            const widget = document.getElementById('examTimerWidget');
            const collapsed = widget.classList.toggle('collapsed');
            localStorage.setItem('examTimerCollapsed', collapsed ? '1' : '0');
        }

        function startExamTimer(endTime) {
            if (!examMode) { hideExamTimerWidget(); return; }

            examEndTime = endTime;
            const widget = document.getElementById('examTimerWidget');
            widget.classList.remove('hidden');
            if (localStorage.getItem('examTimerCollapsed') === '1') widget.classList.add('collapsed');
            updateExamTimerDisplay();
            if (examTimerInterval) clearInterval(examTimerInterval);
            examTimerInterval = setInterval(() => {
                const remaining = examEndTime - Date.now();
                if (remaining <= 0) {
                    clearInterval(examTimerInterval);
                    examTimerInterval = null;
                    document.getElementById('examTimerDisplay').textContent = "00:00";
                    alert("Temps écoulé, validation du test...");
                    validateFullSession();
                    return;
                }
                updateExamTimerDisplay();
            }, 1000);
        }

        function updateExamTimerDisplay() {
            const remaining = Math.max(0, examEndTime - Date.now());
            const m = Math.floor(remaining / 60000);
            const s = Math.floor((remaining % 60000) / 1000);
            const el = document.getElementById('examTimerDisplay');
            if (el) {
                el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                el.classList.toggle('low-time', remaining > 0 && remaining < 60000);
            }
        }

        function collectCurrentAnswers() {
            const answers = {};
            currentSession.forEach((q, qIdx) => {
                answers[qIdx] = [];
                q.options.forEach((_, oIdx) => {
                    const cb = document.getElementById(`q${qIdx}_o${oIdx}`);
                    if (cb && cb.checked) answers[qIdx].push(oIdx);
                });
            });
            return answers;
        }

        function validateQuestionDP(qIdx) {
            const q = currentSession[qIdx];
            const hasAnswer = q.options.some((_, oIdx) => {
                const cb = document.getElementById(`q${qIdx}_o${oIdx}`);
                return cb && cb.checked;
            });
            if (!hasAnswer) {
                alert("Vous devez cocher au moins une réponse avant de valider.");
                return;
            }
            if (!confirm("Valider cette question définitivement ?")) return;

            stopQuestionTimer(qIdx);
            const snapshot = collectCurrentAnswers();
            dpValidated[qIdx] = true;
            renderSessionScreen(snapshot);
            saveSessionState();
            afterUserAction();
        }

        function renderSessionScreen(restoreAnswers) {
            const canceledItems = getCanceledItems();
            const container = document.getElementById('questionsContainer');

            if (currentQuestionIndex !== null && questionStartTimes[currentQuestionIndex]) {
                stopQuestionTimer(currentQuestionIndex);
            }

            container.innerHTML = currentSession.map((q, qIdx) => {
                const isDpLocked = dpMode && qIdx > 0 && !dpValidated[qIdx - 1];
                const isDpValidatedThis = dpMode && dpValidated[qIdx];

                if (isDpLocked) {
                    return `
                    <div class="que sngmultichoice notyetanswered" id="question-${qIdx}">
                        <div class="info">
                            <h3 class="no">Question <span class="qno">${qIdx + 1}</span></h3>
                            <div class="state">Verrouillée</div>
                        </div>
                        <div class="content">
                            <div class="alert alert-secondary mb-0">
                                <i class="fa-solid fa-lock"></i> Répondez à la question précédente pour déverrouiller.
                            </div>
                        </div>
                    </div>`;
                }

                const stats = getQcmStats(q.id);

                return `
                <div class="que sngmultichoice deferredfeedback notyetanswered" id="question-${qIdx}" onclick="focusQuestion(${qIdx})">
                    <div class="info">
                        <h3 class="no">Question <span class="qno">${qIdx + 1}</span></h3>
                        <div class="state">${isDpValidatedThis ? 'Validée' : 'En cours'}</div>
                        <div class="grade">Barème EDN</div>
                        ${!examMode ? `<div><span class="badge bg-${stats.cls}">${stats.label}</span></div>` : ''}
                    </div>
                    <div class="content">
                        <div class="formulation clearfix">
                            <div class="qtext">
                                <p>${escapeHTML(q.question)}</p>
                                ${q.image ? `<img src="${escapeHTML(q.image)}">` : ''}
                            </div>
                            <fieldset class="ablock">
                                <legend class="prompt">Réponse</legend>
                                <div class="answer">
                                    ${q.options.map((opt, oIdx) => {
                                        const isCanceled = canceledItems.includes(opt.id);
                                        const isDisabled = isCanceled || isDpValidatedThis;
                                        return `
                                        <div class="${oIdx % 2 === 0 ? 'r0' : 'r1'} align-items-center">
                                            <input type="checkbox" id="q${qIdx}_o${oIdx}" ${isDisabled ? 'disabled' : ''} onchange="saveSessionState(); stopQuestionTimer(${qIdx})">
                                            <label for="q${qIdx}_o${oIdx}" data-region="answer-label" class="${isCanceled ? 'item-canceled' : ''}">
                                                <span class="answernumber">${String.fromCharCode(97 + oIdx)}. </span>
                                                <div class="flex-fill ml-1"><p>${escapeHTML(opt.text)} ${isCanceled ? '<strong class="text-danger">(ANNULÉ)</strong>' : ''}</p></div>
                                            </label>
                                        </div>`;
                                    }).join('')}
                                </div>
                            </fieldset>
                        </div>
                        ${!examMode ? `
                        <div class="confidence-selector mt-3 pt-2 border-top">
                            <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
                                <small class="fw-bold text-secondary"><i class="fa-solid fa-brain"></i> Ressenti :</small>
                                <div class="btn-group btn-group-sm" role="group">
                                    <input type="radio" class="btn-check" name="conf_${qIdx}" id="conf_high_${qIdx}" autocomplete="off" ${isDpValidatedThis ? 'disabled' : ''} onchange="setConfidence('${q.id}', 'sure')">
                                    <label class="btn btn-outline-success" for="conf_high_${qIdx}">🎯 Sûr</label>

                                    <input type="radio" class="btn-check" name="conf_${qIdx}" id="conf_mid_${qIdx}" autocomplete="off" ${isDpValidatedThis ? 'disabled' : ''} onchange="setConfidence('${q.id}', 'hesitant')">
                                    <label class="btn btn-outline-warning" for="conf_mid_${qIdx}">🤔 Hésitant</label>

                                    <input type="radio" class="btn-check" name="conf_${qIdx}" id="conf_low_${qIdx}" autocomplete="off" ${isDpValidatedThis ? 'disabled' : ''} onchange="setConfidence('${q.id}', 'guess')">
                                    <label class="btn btn-outline-danger" for="conf_low_${qIdx}">🎲 Au hasard</label>
                                </div>
                            </div>
                        </div>` : ''}
                        ${dpMode && !isDpValidatedThis ? `
                        <div class="mt-3 pt-2 border-top text-end">
                            <button class="btn btn-uness btn-sm" onclick="validateQuestionDP(${qIdx})">Valider cette question</button>
                        </div>` : ''}
                    </div>
                </div>`;
            }).join('');

            const firstQuestion = document.querySelector('.que:not(.hidden)');
            if (firstQuestion) {
                const qIdx = parseInt(firstQuestion.id.replace('question-', ''));
                startQuestionTimer(qIdx);
            }

            if (restoreAnswers) {
                currentSession.forEach((q, qIdx) => {
                    (restoreAnswers[qIdx] || []).forEach(oIdx => {
                        const cb = document.getElementById(`q${qIdx}_o${oIdx}`);
                        if (cb) cb.checked = true;
                    });
                    if (sessionConfidence[q.id]) {
                        const confLevel = sessionConfidence[q.id];
                        const radio = document.getElementById(`conf_${confLevel}_${qIdx}`);
                        if (radio) radio.checked = true;
                    }
                });
            }
        }

        function focusQuestion(qIdx) {
            if (currentQuestionIndex !== null && questionStartTimes[currentQuestionIndex]) {
                stopQuestionTimer(currentQuestionIndex);
            }
            startQuestionTimer(qIdx);
            currentQuestionIndex = qIdx;
        }

        function saveSessionState() {
            if (currentSession.length === 0) return;

            const state = {
                session: currentSession.map(q => ({
                    id: q.id,
                    answered: collectCurrentAnswers()[currentSession.indexOf(q)].length > 0
                })),
                dpValidated: [...dpValidated],
                confidence: {...sessionConfidence},
                startTime: sessionStartTime,
                questionStartTimes: {...questionStartTimes}
            };
            localStorage.setItem('currentSessionState', JSON.stringify(state));

            if (currentUser) {
                db.collection(`users/${currentUser.uid}/metadata`).doc('currentSession').set({
                    ...state,
                    userId: currentUser.uid,
                    syncedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(console.error);
            }
        }

        function restoreSessionState() {
            const savedState = localStorage.getItem('currentSessionState');
            if (!savedState) return false;

            try {
                const state = JSON.parse(savedState);
                const validSession = state.session.filter(q => allQcmsIndex[q.id]);
                if (validSession.length === 0) return false;

                currentSession = validSession.map(q => ({
                    ...allQcmsIndex[q.id],
                    options: shuffle(allQcmsIndex[q.id].options)
                }));
                dpValidated = state.dpValidated || new Array(currentSession.length).fill(false);
                sessionConfidence = state.confidence || {};
                sessionStartTime = state.startTime || Date.now();
                questionStartTimes = state.questionStartTimes || {};
                currentQuestionIndex = 0;

                document.getElementById('sessionScreen').classList.remove('hidden');
                renderSessionScreen();

                return true;
            } catch (e) {
                return false;
            }
        }

        function startSession() {
            const node = getNode(currentPath);
            const canceledQCMs = getCanceledQCMs();
            const availableQcms = node.filter(q => !canceledQCMs.includes(q.id));

            if (availableQcms.length === 0) {
                alert("Aucune question disponible dans ce chapitre.");
                return;
            }

            const sizeInput = parseInt(document.getElementById('sessionSize').value, 10);
            let requestedSize = isNaN(sizeInput) || sizeInput < 1 ? 10 : sizeInput;
            const size = Math.min(requestedSize, availableQcms.length);

            const examModeChecked = document.getElementById('examModeToggle').checked;
            const dpModeChecked = document.getElementById('dpModeToggle').checked;
            let examDuration = null;
            if (examModeChecked) {
                const durInput = parseInt(document.getElementById('examDurationInput').value, 10);
                examDuration = isNaN(durInput) || durInput < 1 ? 30 : durInput;
            }

            launchSession(shuffle(availableQcms).slice(0, size), {
                examMode: examModeChecked,
                dpMode: dpModeChecked,
                examDuration
            });
        }

        function toggleExamDurationInput() {
            const checked = document.getElementById('examModeToggle').checked;
            document.getElementById('examDurationWrapper').classList.toggle('hidden', !checked);
        }

        function launchSession(qcms, opts = {}) {
            clearExamTimer();
            ['homeScreen', 'chapterScreen', 'qcmScreen', 'statsScreen', 'correctionScreen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            examMode = !!opts.examMode;
            dpMode = !!opts.dpMode;

            sessionValidated = false;
            currentSession = qcms.map(q => ({ ...q, options: shuffle(q.options) }));
            dpValidated = new Array(currentSession.length).fill(false);
            sessionStartTime = Date.now();
            questionStartTimes = {};
            currentQuestionIndex = 0;

            for (let key in sessionConfidence) delete sessionConfidence[key];

            document.getElementById('sessionScreen').classList.remove('hidden');
            renderSessionScreen();

            if (examMode && opts.examDuration) {
                startExamTimer(Date.now() + opts.examDuration * 60000);
            } else {
                hideExamTimerWidget();
            }

            saveSessionState();
            window.scrollTo(0, 0);
        }

        function startErrorReviewSession() {
            if (!currentUser) {
                alert("Connectez-vous pour utiliser cette fonctionnalité.");
                return;
            }

            const errorLog = getErrorLog();
            const errorIds = [...new Set(Object.values(errorLog).filter(e => e.fp > 0 || e.fn > 0).map(e => e.qcmId))];
            const canceledQCMs = getCanceledQCMs();

            const qcms = errorIds.map(id => allQcmsIndex[id]).filter(q => q && !canceledQCMs.includes(q.id));

            if (qcms.length === 0) {
                alert("Aucune erreur à réviser !");
                return;
            }

            document.getElementById('homeScreen').classList.add('hidden');
            launchSession(shuffle(qcms));
        }

        // =============================================
        // VALIDATION COMPLETE DE LA SESSION & CORRECTION
        // =============================================
        function validateFullSession() {
            Object.keys(questionStartTimes).forEach(qIdx => {
                stopQuestionTimer(parseInt(qIdx));
            });

            if (sessionValidated) return;
            sessionValidated = true;

            const answers = collectCurrentAnswers();
            let totalEdnPoints = 0;
            const correctionDetailsList = [];

            currentSession.forEach((q, qIdx) => {
                const userAnswers = answers[qIdx] || [];
                
                // Calcul des points EDN (1.0, 0.5, 0.2 ou 0.0)
                const points = calculateEDNPoints(userAnswers, q.options);
                totalEdnPoints += points;

                const isPerfect = (points === 1.0);

                // Analyse des réponses fausses / manquantes pour le carnet d'erreurs
                q.options.forEach((opt, oIdx) => {
                    const isUserAnswer = userAnswers.includes(oIdx);
                    const isCorrectOption = opt.isCorrect;

                    if (isUserAnswer && !isCorrectOption) {
                        logItemResult(q.subjectPath, q.question, opt.text, 'false_positive', q.id, examMode);
                    } else if (!isUserAnswer && isCorrectOption) {
                        logItemResult(q.subjectPath, q.question, opt.text, 'false_negative', q.id, examMode);
                    }
                });

                // On conserve les détails pour TOUTES les questions en mode Examen
                correctionDetailsList.push({
                    q: q,
                    userAnswers: userAnswers.map(i => q.options[i].text),
                    points: points,
                    isPerfect: isPerfect
                });

                saveAttempt({
                    qcmId: q.id,
                    correct: isPerfect,
                    ednPoints: points,
                    confidence: sessionConfidence[q.id] || null,
                    durationSeconds: sessionConfidence[q.id]?.duration || null,
                    examMode: examMode,
                    dpMode: dpMode,
                    date: new Date().toISOString(),
                    subjectPath: q.subjectPath
                });
            });

            // Note calculée sur 20 selon le barème EDN
            const noteSur20 = ((totalEdnPoints / currentSession.length) * 20).toFixed(2);

            document.getElementById('sessionScreen').classList.add('hidden');
            document.getElementById('correctionScreen').classList.remove('hidden');
            
            document.getElementById('score').innerHTML = `
                <div class="mb-1">Note EDN : <span class="text-${noteSur20 >= 14 ? 'success' : noteSur20 >= 10 ? 'warning' : 'danger'}">${noteSur20} / 20</span></div>
                <div style="font-size: 0.9rem; font-weight: normal;" class="text-muted">Total EDN : ${totalEdnPoints.toFixed(1)} / ${currentSession.length} pt(s)</div>
            `;

            const correctionDetails = document.getElementById('correctionDetails');
            
            // On affiche TOUS les QCMs dans la correction
            correctionDetails.innerHTML = correctionDetailsList.map((item, idx) => {
                const q = item.q;
                const points = item.points;

                let stateClass = "incorrect";
                let stateLabel = "0 point";
                if (points === 1.0) { stateClass = "correct"; stateLabel = "1 pt (5/5)"; }
                else if (points === 0.5) { stateClass = "partiallycorrect"; stateLabel = "0.5 pt (4/5)"; }
                else if (points === 0.2) { stateClass = "partiallycorrect"; stateLabel = "0.2 pt (3/5)"; }

                return `
                <div class="que sngmultichoice" id="qcm-corr-block-${q.id}">
                    <div class="info">
                        <h3 class="no">Question <span class="qno">${idx + 1}</span></h3>
                        <div class="grade">Barème EDN</div>
                        <div class="correctness ${stateClass}">${stateLabel}</div>
                    </div>
                    <div class="content">
                        <div class="formulation clearfix">
                            <div class="qtext">
                                <p>${escapeHTML(q.question)}</p>
                                ${q.image ? `<img src="${escapeHTML(q.image)}">` : ''}
                            </div>
                            <fieldset class="ablock">
                                <legend class="prompt">Réponse</legend>
                                <div class="answer">
                                    ${q.options.map((opt, oIdx) => {
                                        const isUserAnswer = item.userAnswers.includes(opt.text);
                                        const isCorrect = opt.isCorrect;
                                        let cls = '';
                                        if (isUserAnswer && isCorrect) cls = 'correct';
                                        else if (isUserAnswer && !isCorrect) cls = 'incorrect';
                                        else if (!isUserAnswer && isCorrect) cls = 'correctnotchecked';

                                        return `
                                        <div class="${oIdx % 2 === 0 ? 'r0' : 'r1'} ${cls}">
                                            <input type="checkbox" ${isUserAnswer ? 'checked' : ''} disabled>
                                            <label for="q${idx}_o${oIdx}" data-region="answer-label">
                                                <span class="answernumber">${String.fromCharCode(97 + oIdx)}. </span>
                                                <div class="flex-fill ml-1">
                                                    <p>${escapeHTML(opt.text)} ${isCorrect ? '<i class="icon fa-solid fa-check"></i>' : ''}</p>
                                                </div>
                                            </label>
                                        </div>`;
                                    }).join('')}
                                </div>
                            </fieldset>
                            <div class="outcome">
                                <i class="fa-solid fa-lightbulb"></i> Réponses correctes :
                                ${q.options.filter(opt => opt.isCorrect).map((opt) => String.fromCharCode(97 + q.options.indexOf(opt))).join(', ')}
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            currentSession = [];
            dpValidated = [];
            sessionConfidence = {};
            clearExamTimer();
            localStorage.removeItem('currentSessionState');

            if (currentUser) {
                db.collection(`users/${currentUser.uid}/metadata`).doc('currentSession').delete().catch(console.error);
            }

            afterUserAction();
        }

        function backToQCMScreen() {
            document.getElementById('correctionScreen').classList.add('hidden');
            document.getElementById('qcmScreen').classList.remove('hidden');
        }

        function backToChapters() {
            if (currentPath.length <= 1) {
                showHomeScreen();
                return;
            }
            openNode(currentPath.slice(0, -1));
        }

        function backOneLevel() {
            if (currentPath.length <= 1) {
                showHomeScreen();
                return;
            }
            openNode(currentPath.slice(0, -1));
        }

        function showHomeScreen() {
            currentPath = [];
            ['sessionScreen', 'correctionScreen', 'chapterScreen', 'qcmScreen', 'statsScreen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById('homeScreen').classList.remove('hidden');
            displaySubjects();
            renderHomeStats();
        }

        function countLeafFiles(node) {
            if (isLeaf(node)) return node.length;
            return Object.values(node).reduce((acc, child) => acc + countLeafFiles(child), 0);
        }

        function displaySubjects() {
            currentPath = [];
            const container = document.getElementById('subjectsList');
            container.innerHTML = '';

            Object.entries(data).forEach(([key, node]) => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
                item.innerHTML = `
                    <div><i class="fa-solid fa-book me-2"></i><strong>${escapeHTML(key)}</strong></div>
                    <span class="badge bg-primary rounded-pill">${countLeafFiles(node)}</span>
                `;
                item.onclick = () => openNode([key]);
                container.appendChild(item);
            });
        }

        function openNode(path) {
            currentPath = path;
            const node = getNode(path);

            if (isLeaf(node)) {
                document.getElementById('homeScreen').classList.add('hidden');
                document.getElementById('chapterScreen').classList.add('hidden');
                document.getElementById('qcmScreen').classList.remove('hidden');
                document.getElementById('sessionChapterTitle').textContent = path.join(' > ');
                return;
            }

            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('qcmScreen').classList.add('hidden');
            document.getElementById('chapterScreen').classList.remove('hidden');
            document.getElementById('currentSubjectTitle').textContent = path[path.length - 1];

            renderBreadcrumb(path);

            const list = document.getElementById('chaptersList');
            list.innerHTML = '';
            Object.entries(node).forEach(([key, child]) => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
                const badge = isLeaf(child) ? child.length : countLeafFiles(child);
                item.innerHTML = `
                    <div><i class="fa-solid fa-book me-2"></i><strong>${escapeHTML(key)}</strong></div>
                    <span class="badge bg-secondary rounded-pill">${badge}</span>
                `;
                item.onclick = () => openNode([...path, key]);
                list.appendChild(item);
            });
        }

        function renderBreadcrumb(path) {
            const breadcrumb = document.getElementById('breadcrumb');
            breadcrumb.innerHTML = `<span onclick="showHomeScreen()">Accueil</span>` + path.map((part, idx) => {
                const isLast = idx === path.length - 1;
                const subPath = path.slice(0, idx + 1);
                return isLast
                    ? ` / ${escapeHTML(part)}`
                    : ` / <span onclick='openNode(${JSON.stringify(subPath)})'>${escapeHTML(part)}</span>`;
            }).join('');
        }

        function renderHomeStats() {
            const stats = computeGlobalStats();
            const badge = document.getElementById('homeStatsBadge');
            if (!stats) {
                badge.classList.add('hidden');
                badge.textContent = '';
                return;
            }
            badge.textContent = stats.successRate + '%';
            badge.classList.remove('hidden');
        }

        function openStatsScreen() {
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('statsScreen').classList.remove('hidden');
            renderStatsScreen();
        }

        function closeStatsScreen() {
            showHomeScreen();
        }

        function renderStatsScreen() {
            const stats = computeGlobalStats();
            const content = document.getElementById('statsContent');
            if (!stats) {
                content.innerHTML = `<div class="alert alert-info">Aucune statistique enregistrée.</div>`;
                return;
            }

            content.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <div class="card mb-3">
                            <div class="card-body">
                                <h5 class="card-title"><i class="fa-solid fa-percentage"></i> Taux de réussite global</h5>
                                <h2 class="text-primary">${stats.successRate}%</h2>
                                <p class="card-text">
                                    <small>${stats.total} QCMs terminés • ${stats.falseCertaintyCount} erreurs avec certitude ("sûr")</small>
                                </p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card mb-3">
                            <div class="card-body">
                                <h5 class="card-title"><i class="fa-solid fa-chart-bar"></i> Par certitude</h5>
                                <div class="row text-center">
                                    <div class="col-4">
                                        <h6>Sûr</h6>
                                        <h4 class="text-success">${stats.sureRate || 'N/A'}%</h4>
                                    </div>
                                    <div class="col-4">
                                        <h6>Hésitant</h6>
                                        <h4 class="text-warning">${stats.hesitantRate || 'N/A'}%</h4>
                                    </div>
                                    <div class="col-4">
                                        <h6>Au hasard</h6>
                                        <h4 class="text-danger">${stats.guessRate || 'N/A'}%</h4>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // =============================================
        // LANCEMENT
        // =============================================
        loadAllQCM();
    </script>
</body>
</html>
