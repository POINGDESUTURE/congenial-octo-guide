    <!-- ===== SCRIPT PRINCIPAL (ton code + Firebase) ===== -->
    <script>
        // =============================================
        // CONFIGURATION FIREBASE (À PERSONNALISER !)
        // =============================================
        // Remplace ces valeurs par celles de TON projet Firebase (voir Firebase Console)
        const firebaseConfig = {
            apiKey: "AIzaSyAGN9ncsAXA6zOQF9euLL69YTX0yKjADV4",
            authDomain: "medicomed.firebaseapp.com",
            projectId: "medicomed",
            storageBucket: "medicomed.firebasestorage.app",
            messagingSenderId: "653914992834",
            appId: "1:653914992834:web:88bc3797fe83ef7c6d4b5b"
        };

            // Initialise Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Désactive le cache pour éviter les conflits
    db.settings({ cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED });

    // Variables globales
    let data = {};
    let allQcmsIndex = {};
    let currentPath = [], currentSession = [], missedAnswers = [];
    let sessionValidated = false;
    let examMode = false;
    let dpMode = false;
    let examEndTime = null;
    let examTimerInterval = null;
    let dpValidated = [];
    let currentUser = null;
    const sessionConfidence = {};
    let sessionStartTime = null;
    let questionStartTimes = {};
    let currentQuestionIndex = null;

    // =============================================
    // FONCTIONS D'AUTHENTIFICATION (définies ici pour éviter "not defined")
    // =============================================
    function showLoginModal() {
        const modalEl = document.getElementById('loginModal');
        if (modalEl) {
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
            const errorEl = document.getElementById('loginError');
            if (errorEl) errorEl.classList.add('hidden');
        }
    }

    function showSignupModal() {
        const modalEl = document.getElementById('signupModal');
        if (modalEl) {
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
            const errorEl = document.getElementById('signupError');
            if (errorEl) errorEl.classList.add('hidden');
        }
    }

    async function loginWithModal() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const errorContainer = document.getElementById('loginError');

        if (!email || !password) {
            errorContainer.textContent = "Veuillez remplir tous les champs.";
            errorContainer.classList.remove('hidden');
            return;
        }

        try {
            await auth.signInWithEmailAndPassword(email, password);
            bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
            document.getElementById('loginForm').reset();
        } catch (error) {
            console.error("Erreur de connexion :", error);
            errorContainer.textContent = getFirebaseAuthErrorMessage(error.code);
            errorContainer.classList.remove('hidden');
        }
    }

    async function signupWithModal() {
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        const errorContainer = document.getElementById('signupError');

        if (!email || !password) {
            errorContainer.textContent = "Veuillez remplir tous les champs.";
            errorContainer.classList.remove('hidden');
            return;
        }

        if (password.length < 6) {
            errorContainer.textContent = "Le mot de passe doit contenir au moins 6 caractères.";
            errorContainer.classList.remove('hidden');
            return;
        }

        try {
            await auth.createUserWithEmailAndPassword(email, password);
            bootstrap.Modal.getInstance(document.getElementById('signupModal')).hide();
            document.getElementById('signupForm').reset();
            alert("Compte créé avec succès ! Bienvenue sur QCM Médecine.");
        } catch (error) {
            console.error("Erreur d'inscription :", error);
            errorContainer.textContent = getFirebaseAuthErrorMessage(error.code);
            errorContainer.classList.remove('hidden');
        }
    }

    function logout() {
        if (confirm("Voulez-vous vous déconnecter ? Vos données locales seront conservées.")) {
            auth.signOut().catch(error => {
                console.error("Erreur de déconnexion :", error);
            });
        }
    }

    function getFirebaseAuthErrorMessage(errorCode) {
        const messages = {
            'auth/user-not-found': 'Aucun compte trouvé avec cet email.',
            'auth/wrong-password': 'Mot de passe incorrect.',
            'auth/email-already-in-use': 'Un compte existe déjà avec cet email.',
            'auth/invalid-email': 'Email invalide.',
            'auth/weak-password': 'Le mot de passe doit contenir au moins 6 caractères.',
            'auth/network-request-failed': 'Erreur de connexion. Vérifiez votre connexion internet.',
            'auth/internal-error': 'Erreur interne. Veuillez réessayer.'
        };
        return messages[errorCode] || "Une erreur est survenue. Veuillez réessayer.";
    }

    // Met à jour l'UI en fonction de l'utilisateur connecté
    function updateAuthUI() {
        const loggedOutButtons = document.getElementById('loggedOutButtons');
        const loggedInButtons = document.getElementById('loggedInButtons');
        const userEmailElement = document.getElementById('userEmail');
        const migrationButton = document.getElementById('migrationButtonContainer');

        if (currentUser) {
            loggedOutButtons.classList.add('hidden');
            loggedInButtons.classList.remove('hidden');
            userEmailElement.textContent = currentUser.email;
            migrationButton.style.display = (localStorage.getItem('qcm_attempts_log') || localStorage.getItem('digital_error_log')) ? 'block' : 'none';
        } else {
            loggedOutButtons.classList.remove('hidden');
            loggedInButtons.classList.add('hidden');
            userEmailElement.textContent = '';
            migrationButton.style.display = 'none';
        }
    }

    // Écoute les changements d'état de connexion
    auth.onAuthStateChanged((user) => {
        currentUser = user;
        updateAuthUI();
        if (user) {
            console.log("✅ Utilisateur connecté :", user.uid, user.email);
            syncLocalToCloud();
            loadCloudData();
        } else {
            console.log("❌ Aucun utilisateur connecté");
        }
    });

    // =============================================
    // FONCTIONS DE SYNCHRONISATION (corrigées avec async/await)
    // =============================================
    async function syncLocalToCloud() {
        if (!currentUser) return;

        const userId = currentUser.uid;
        const batch = db.batch();
        console.log("🔄 Synchronisation locale → cloud...");

        try {
            // 1. Synchronise qcm_attempts_log
            const localAttempts = JSON.parse(localStorage.getItem('qcm_attempts_log') || '[]');
            if (localAttempts.length > 0) {
                const cloudAttemptsSnapshot = await db.collection(`users/${userId}/qcmAttempts`).get();

                const newAttempts = localAttempts.filter(local => {

                    );

                        ...attempt,
                        userId: userId,
                        syncedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                const cloudErrorLogSnapshot = await db.collection(`users/${userId}/errorLog`).get();

                    cloudErrorLog[doc.data().key] = doc.data();

                            ...value,
                            key: key,
                            userId: userId,
                            syncedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                });
                console.log(`📤 ${Object.keys(localErrorLog).length} entrées d'erreurs synchronisées.`);
            }

            // 3. Synchronise canceled_qcms et canceled_items
            const localCanceledQcms = JSON.parse(localStorage.getItem('canceled_qcms') || '[]');
            const localCanceledItems = JSON.parse(localStorage.getItem('canceled_items') || '[]');

            if (localCanceledQcms.length > 0 || localCanceledItems.length > 0) {
                const metadataRef = db.collection(`users/${userId}/metadata`).doc('canceled');
                batch.set(metadataRef, {
                    canceledQcms: localCanceledQcms,
                    canceledItems: localCanceledItems,
                    userId: userId,
                    syncedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                console.log(`📤 QCM/Items annulés synchronisés.`);
            }

            // 4. Synchronise les préférences utilisateur
            const preferences = {
                examTimerCollapsed: localStorage.getItem('examTimerCollapsed') || '0',

            batch.set(preferencesRef, {
                ...preferences,
                userId: userId,
                syncedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            await batch.commit();
            console.log("✅ Synchronisation locale → cloud terminée.");
            localStorage.setItem('lastSync', new Date().toISOString());
        } catch (error) {
            console.error("❌ Erreur de synchronisation :", error);
        }

    async function loadCloudData() {
        if (!currentUser) return;

        const userId = currentUser.uid;
        console.log("🔄 Chargement des données cloud → local...");

        try {
            // 1. Charge qcm_attempts_log
            const attemptsSnapshot = await db.collection(`users/${userId}/qcmAttempts`).get();
            const cloudAttempts = attemptsSnapshot.docs.map(doc => doc.data());
            if (cloudAttempts.length > 0) {
                const localAttempts = JSON.parse(localStorage.getItem('qcm_attempts_log') || '[]');
                const mergedAttempts = mergeAttempts(localAttempts, cloudAttempts);
                localStorage.setItem('qcm_attempts_log', JSON.stringify(mergedAttempts));
                console.log(`📥 ${mergedAttempts.length} attempts fusionnés.`);
            }

            // 2. Charge digital_error_log
            const errorLogSnapshot = await db.collection(`users/${userId}/errorLog`).get();
            const cloudErrorLog = {};
            errorLogSnapshot.forEach(doc => {
                cloudErrorLog[doc.data().key] = doc.data();
            });
            const localErrorLog = JSON.parse(localStorage.getItem('digital_error_log') || '{}');
            const mergedErrorLog = { ...localErrorLog, ...cloudErrorLog };

    // Fusionne les attempts locaux et cloud en résolvant les conflits
    function mergeAttempts(localAttempts, cloudAttempts) {
        const merged = [...localAttempts];
        const mergedIds = new Set(localAttempts.map(a => `${a.qcmId}-${a.timestamp || a.date}`));

        cloudAttempts.forEach(cloud => {
            const id = `${cloud.qcmId}-${cloud.timestamp || cloud.date}`;
            if (!mergedIds.has(id)) {
                merged.push(cloud);
                mergedIds.add(id);
            }
        });

        // Trie par date (plus récent en premier)
        merged.sort((a, b) => {
            const aTime = new Date(a.timestamp || a.date).getTime();
            const bTime = new Date(b.timestamp || b.date).getTime();
            return bTime - aTime;
        });

        // Limite à MAX_ATTEMPTS_LOG
        const MAX_ATTEMPTS_LOG = 5000;
        if (merged.length > MAX_ATTEMPTS_LOG) {
            merged.splice(MAX_ATTEMPTS_LOG);
        }

        return merged;
    }

        if (!confirm("Voulez-vous migrer vos données locales vers le cloud ?\nCette action ne supprimera pas vos données locales et permettra de les retrouver sur tous vos appareils.")) {
            return;
        }

        const userId = currentUser.uid;
        const batch = db.batch();
        let count = 0;

        try {
            // 1. Migration de qcm_attempts_log
            const attemptsLog = JSON.parse(localStorage.getItem('qcm_attempts_log') || '[]');
            attemptsLog.forEach(attempt => {
                if (!attempt.timestamp) {
                    attempt.timestamp = Date.now();
                }
                const docRef = db.collection(`users/${userId}/qcmAttempts`).doc();
                batch.set(docRef, {
                    ...attempt,
                    userId: userId,
                    migratedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                count++;
            });

            // 2. Migration de digital_error_log
            const errorLog = JSON.parse(localStorage.getItem('digital_error_log') || '{}');
            Object.entries(errorLog).forEach(([key, value]) => {
                const docRef = db.collection(`users/${userId}/errorLog`).doc(key);
                batch.set(docRef, {
                    ...value,
                    key: key,
                    userId: userId,
                    migratedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                count++;
            });

            // 3. Migration des QCM annulés
            const canceledQcms = JSON.parse(localStorage.getItem('canceled_qcms') || '[]');
            const canceledItems = JSON.parse(localStorage.getItem('canceled_items') || '[]');
            if (canceledQcms.length > 0 || canceledItems.length > 0) {
                const metadataRef = db.collection(`users/${userId}/metadata`).doc('canceled');
                batch.set(metadataRef, {
                    canceledQcms: canceledQcms,
                    canceledItems: canceledItems,
                    userId: userId,
                    migratedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                count++;
            }

            await batch.commit();
            alert(`✅ Migration terminée ! ${count} données migrées vers le cloud.\n\nTu peux maintenant te connecter sur n'importe quel appareil pour retrouver tes données.`);
            document.getElementById('migrationButtonContainer').style.display = 'none';
        } catch (error) {
            console.error("❌ Erreur lors de la migration :", error);
            alert("❌ Erreur lors de la migration. Vérifiez la console du navigateur (F12) pour plus de détails.");
        }
    }

    function escapeHTML(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function shuffle(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Sauvegarde un attempt (modifié pour Firebase)
    async function saveAttempt(record) {
        if (!record.timestamp) {
            record.timestamp = Date.now();
        }

        const log = getAttemptsLog();
        const exists = log.some(a => a.qcmId === record.qcmId && a.timestamp === record.timestamp);
        if (!exists) {
            log.push(record);
            if (log.length > MAX_ATTEMPTS_LOG) log.splice(0, log.length - MAX_ATTEMPTS_LOG);
            localStorage.setItem('qcm_attempts_log', JSON.stringify(log));
        }

        if (currentUser) {
            try {
                const snapshot = await db.collection(`users/${currentUser.uid}/qcmAttempts`)
                    .where('qcmId', '==', record.qcmId)
                    .where('timestamp', '==', record.timestamp)
                    .get();

                if (snapshot.empty) {
                    await db.collection(`users/${currentUser.uid}/qcmAttempts`).add({
                        ...record,
                        userId: currentUser.uid,
                        syncedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                console.error("❌ Erreur de sauvegarde dans Firestore :", error);
            }
        }

        afterUserAction();
    }

    function getQcmStats(qcmId) {
        const attempts = getAttemptsLog().filter(a => a.qcmId === qcmId);
        if (attempts.length === 0) return { label: 'Jamais vu', cls: 'secondary' };

        const lastTwo = attempts.slice(-2);
        const masteredRecently = lastTwo.length >= 2 && lastTwo.every(a => a.correct);
        const errorCount = attempts.filter(a => !a.correct).length;

        if (masteredRecently) return { label: 'Maîtrisé', cls: 'success' };
        if (errorCount >= 2) return { label: 'Erreur récurrente', cls: 'danger' };
        return { label: `Vu ${attempts.length}×`, cls: 'info' };
    }

    function computeGlobalStats() {
        const log = getAttemptsLog();
        const total = log.length;
        if (total === 0) return null;

        const successCount = log.filter(a => a.correct).length;
        const successRate = (successCount / total * 100).toFixed(1);

        const byConf = { sure: [], hesitant: [], guess: [] };
        log.forEach(a => {
            if (a.confidence && byConf[a.confidence]) byConf[a.confidence].push(a.correct);
        });
        const rateOf = key => {
            const arr = byConf[key];
            if (arr.length === 0) return null;
            return (arr.filter(Boolean).length / arr.length * 100).toFixed(0);
        };

        return {
            total,
            successRate,
            sureRate: rateOf('sure'),
            hesitantRate: rateOf('hesitant'),
            guessRate: rateOf('guess'),
            falseCertaintyCount: byConf.sure.filter(c => !c).length
        };
    }

    // Logge le résultat d'un item (modifié pour Firebase)
    async function logItemResult(subjectPath, qcmQuestion, itemText, status, qcmId, isExam) {
        const log = getErrorLog();
        const key = `${subjectPath} > ${qcmQuestion} > ${itemText}`;

        if (!log[key]) {
            log[key] = {
                p: subjectPath,
                q: qcmQuestion,
                i: itemText,
                qcmId: qcmId,
                fp: 0,
                fn: 0,
                examErrorCount: 0,
                confidence: sessionConfidence[qcmId] || 'non spécifié'
            };
        }

        if (status === 'false_positive') {
            log[key].fp += 1;
            if (isExam) log[key].examErrorCount = (log[key].examErrorCount || 0) + 1;
        } else if (status === 'false_negative') {
            log[key].fn += 1;
            if (isExam) log[key].examErrorCount = (log[key].examErrorCount || 0) + 1;
        }

        if (sessionConfidence[qcmId]) {
            log[key].confidence = sessionConfidence[qcmId];
        }

        localStorage.setItem('digital_error_log', JSON.stringify(log));

        if (currentUser) {
            try {
                await db.collection(`users/${currentUser.uid}/errorLog`).doc(key).set({
                    ...log[key],
                    key: key,
                    userId: currentUser.uid,
                    syncedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (error) {
                console.error("❌ Erreur de sauvegarde dans Firestore :", error);
            }
        }

        afterUserAction();
    }

    function setConfidence(qcmId, level) {
        sessionConfidence[qcmId] = level;

        const log = getErrorLog();
        let updated = false;

        Object.keys(log).forEach(key => {
            if (log[key].qcmId === qcmId) {
                log[key].confidence = level;
                updated = true;
            }
        });

        const targetQcm = currentSession.find(q => q.id === qcmId);
        if (targetQcm && (level === 'guess' || level === 'hesitant')) {
            targetQcm.options.forEach(opt => {
                const key = `${targetQcm.subjectPath} > ${targetQcm.question} > ${opt.text}`;
                if (!log[key]) {
                    log[key] = {
                        p: targetQcm.subjectPath,
                        q: targetQcm.question,
                        i: opt.text,
                        qcmId: qcmId,
                        fp: 0,
                        fn: 0,
                        examErrorCount: 0,
                        confidence: level
                    };
                    updated = true;
                }
            });
        }

        if (updated) {
            localStorage.setItem('digital_error_log', JSON.stringify(log));
            afterUserAction();
        }
    }

    function exportErrorLog() {
        const log = getErrorLog();
        const allEntries = Object.values(log);

        const errorItems = allEntries.filter(item => item.fp > 0 || item.fn > 0);
        const luckyGuesses = allEntries.filter(item => (item.fp === 0 && item.fn === 0) && (item.confidence === 'guess' || item.confidence === 'hesitant'));

        if (errorItems.length === 0 && luckyGuesses.length === 0) {
            alert("Aucune donnée enregistrée dans le carnet pour le moment.");
            return;
        }

        errorItems.sort((a, b) => (b.examErrorCount || 0) - (a.examErrorCount || 0));

        let outputText = "PROMPT REVISION IA - CARNET D'ERREURS ET LACUNES ENRICHI\n";
        outputText += "CONSIGNE POUR L'IA :\n";
        outputText += "1. Analyse mes erreurs récurrentes et mes bonnes réponses 'Au hasard' ci-dessous.\n";
        outputText += "2. Priorise les erreurs marquées 'SÛR' (Fausse croyance / Piège critique) et 'AU HASARD' (Lacune totale de cours).\n";
        outputText += "3. Priorise en priorité absolue les erreurs marquées 'REALISE EN MODE EXAMEN', elles pèsent le plus lourd car commises en conditions réelles.\n";
        outputText += "4. Pour chaque notion, explique le piège physiologique/clinique et donne une règle de décision rapide.\n\n";
        outputText += "Légende : FP = Faux Positif, FN = Faux Négatif.\n\n";

        if (errorItems.length > 0) {
            outputText += "--- HISTORIQUE DES ERREURS ---\n\n";
            errorItems.forEach(item => {
                let errDetails = [];
                if (item.fp > 0) errDetails.push(`FP:x${item.fp}`);
                if (item.fn > 0) errDetails.push(`FN:x${item.fn}`);
                const confLabel = item.confidence ? ` | Ressenti: [${item.confidence.toUpperCase()}]` : '';
                const examFlag = item.examErrorCount > 0 ? ` | ⚠️ REALISE EN MODE EXAMEN x${item.examErrorCount} (PRIORITAIRE)` : '';
                outputText += `• [${item.p}] ${item.q}\n  └─ Item: "${item.i}" -> (${errDetails.join(', ')})${confLabel}${examFlag}\n\n`;
            });
        }

        if (luckyGuesses.length > 0) {
            outputText += "--- ⚠️ BONNES RÉPONSES AU HASARD / HÉSITATIONS (À REVOIR) ---\n\n";
            luckyGuesses.forEach(item => {
                outputText += `• [${item.p}] ${item.q}\n  └─ Item: "${item.i}" | Ressenti: [${item.confidence.toUpperCase()}]\n\n`;
            });
        }

        const blob = new Blob([outputText], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `carnet_erreurs_enrichi_${new Date().toISOString().slice(0,10)}.txt`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // CHARGEMENT ET PARSING SÉCURISÉ

    async function loadNode(node, pathParts) {
        if (Array.isArray(node)) {
            const chapters = {};
            for (const file of node) {
                try {
                    const res = await fetch(`QCM/${pathParts.join('/')}/${file}`);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const text = await res.text();
                    const parsed = parseQCMFile(text, pathParts.join(' > '), file);
                    if (parsed.length > 0) {
                        chapters[file.replace('.txt', '').replace(/_/g, ' ')] = parsed;
                    }
                } catch (e) {
                    console.error(`Erreur de chargement du fichier: QCM/${pathParts.join('/')}/${file}`, e);
                }
            }
            return chapters;
        } else {
            const sousDossiers = {};
            for (const key in node) {
                sousDossiers[key] = await loadNode(node[key], [...pathParts, key]);
            }
            return sousDossiers;
        }
    }

            const configResponse = await fetch('QCM/config.json');
            if (!configResponse.ok) throw new Error("Impossible de trouver config.json");

            const subjects = await configResponse.json();
            for (const subject in subjects) {
                data[subject] = await loadNode(subjects[subject], [subject]);
            }
            buildFlatIndex(data);
            loadingEl.classList.add('hidden');

            if (!restoreSessionState()) {
                displaySubjects();
                renderHomeStats();

                        <hr>
                        <p class="mb-0 text-muted" style="font-size: 0.85rem;">Détail : ${escapeHTML(e.message)}</p>

        return node;
    }

    function isLeaf(node) {
        return Array.isArray(node);
    }

    function buildFlatIndex(node) {
        if (Array.isArray(node)) {
            node.forEach(q => { allQcmsIndex[q.id] = q; });
        } else {
            Object.values(node).forEach(child => buildFlatIndex(child));
        }
    }

    function parseQCMFile(content, currentSubjectPath, filename) {
        const qcms = [];
        const blocks = content.replace(/\r/g, '').split(/\n\s*\n+/).filter(b => b.trim());

        blocks.forEach((block, index) => {
            const lines = block.trim().split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length < 6) return;

            let question = lines[0];
            if (question.includes('{') || question.includes(';') || question.includes('<')) return;

            let imagePath = null;
            let optionStartIndex = 1;

            if (lines[1] && lines[1].toUpperCase().startsWith('IMG:')) {
                imagePath = lines[1].substring(4).trim();
                optionStartIndex = 2;
            }

            const options = [];
            const optionRegex = /^(\$?)([A-Ea-e])[\.\)]\s+(.+)$/;

            for (let i = optionStartIndex; i < lines.length; i++) {
                const match = lines[i].match(optionRegex);
                if (match) {
                    const text = match[3];
                    const itemId = generateCleanId(`${currentSubjectPath}_${question}_${text}`);
                    options.push({ id: itemId, text: text, isCorrect: match[1] === '$' });
                }
            }

            if (options.length === 5) {
                const qcmId = generateCleanId(`${currentSubjectPath}_${question}`);
                qcms.push({ id: qcmId, subjectPath: currentSubjectPath, question, image: imagePath, options });
            } else {
                console.warn(`[QCM Ignoré] Fichier: ${filename} | Bloc #${index + 1} | Raison: ${options.length}/5 options détectées.`);
            }
        });
        return qcms;
    }

    // =============================================
    // SESSIONS ET RENDER (avec tracking du temps)
    // =============================================
    function startQuestionTimer(qIdx) {
        currentQuestionIndex = qIdx;
        questionStartTimes[qIdx] = Date.now();
    }

    function stopQuestionTimer(qIdx) {
        if (questionStartTimes[qIdx]) {
            const endTime = Date.now();
            const duration = (endTime - questionStartTimes[qIdx]) / 1000;

            if (!sessionConfidence[currentSession[qIdx].id]) {
                sessionConfidence[currentSession[qIdx].id] = {};
            }
            sessionConfidence[currentSession[qIdx].id].duration = duration;

            const attempts = getAttemptsLog();
            const lastAttempt = attempts.filter(a => a.qcmId === currentSession[qIdx].id).pop();
            if (lastAttempt) {
                lastAttempt.durationSeconds = duration;
                localStorage.setItem('qcm_attempts_log', JSON.stringify(attempts));
            }

            if (currentUser) {
                db.collection(`users/${currentUser.uid}/qcmAttempts`)
                    .where('qcmId', '==', currentSession[qIdx].id)
                    .orderBy('date', 'desc')
                    .limit(1)
                    .get()
                    .then(snapshot => {
                        if (!snapshot.empty) {
                            snapshot.docs[0].ref.update({
                                durationSeconds: duration,
                                syncedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                    });
            }

            delete questionStartTimes[qIdx];
        }
    }

    function clearExamTimer() {
        if (examTimerInterval) clearInterval(examTimerInterval);
        examTimerInterval = null;
        examEndTime = null;
        hideExamTimerWidget();
    }

    function hideExamTimerWidget() {
        const widget = document.getElementById('examTimerWidget');
        if (widget) widget.classList.add('hidden');
    }

    function toggleExamTimerCollapse() {
        const widget = document.getElementById('examTimerWidget');
        const collapsed = widget.classList.toggle('collapsed');
        localStorage.setItem('examTimerCollapsed', collapsed ? '1' : '0');
    }

    function startExamTimer(endTime) {
        if (!examMode) { hideExamTimerWidget(); return; }

        examEndTime = endTime;
        const widget = document.getElementById('examTimerWidget');
        widget.classList.remove('hidden');
        if (localStorage.getItem('examTimerCollapsed') === '1') widget.classList.add('collapsed');
        updateExamTimerDisplay();
        if (examTimerInterval) clearInterval(examTimerInterval);
        examTimerInterval = setInterval(() => {
            const remaining = examEndTime - Date.now();
            if (remaining <= 0) {
                clearInterval(examTimerInterval);
                examTimerInterval = null;
                document.getElementById('examTimerDisplay').textContent = "00:00";
                alert("Temps écoulé, le test va être validé automatiquement.");
                validateFullSession();
                return;
            }
            updateExamTimerDisplay();
        }, 1000);
    }

    function updateExamTimerDisplay() {
        const remaining = Math.max(0, examEndTime - Date.now());
        const m = Math.floor(remaining / 60000);
        const s = Math.floor((remaining % 60000) / 1000);
        const el = document.getElementById('examTimerDisplay');
        if (el) {
            el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            el.classList.toggle('low-time', remaining > 0 && remaining < 60000);
        }
    }

    function collectCurrentAnswers() {
        const answers = {};
        currentSession.forEach((q, qIdx) => {
            answers[qIdx] = [];
            q.options.forEach((_, oIdx) => {
                const cb = document.getElementById(`q${qIdx}_o${oIdx}`);
                if (cb && cb.checked) answers[qIdx].push(oIdx);
            });
        });
        return answers;
    }

    function validateQuestionDP(qIdx) {
        const q = currentSession[qIdx];
        const hasAnswer = q.options.some((_, oIdx) => {
            const cb = document.getElementById(`q${qIdx}_o${oIdx}`);
            return cb && cb.checked;
        });
        if (!hasAnswer) {
            alert("Vous devez cocher au moins une réponse avant de valider cette question.");
            return;
        }
        if (!confirm("Valider cette question ? Vous ne pourrez plus modifier votre réponse ensuite.")) return;

        stopQuestionTimer(qIdx);
        const snapshot = collectCurrentAnswers();
        dpValidated[qIdx] = true;
        renderSessionScreen(snapshot);
        saveSessionState();
        afterUserAction();
    }

    function focusQuestion(qIdx) {
        if (currentQuestionIndex !== null && questionStartTimes[currentQuestionIndex]) {
            stopQuestionTimer(currentQuestionIndex);
        }
        startQuestionTimer(qIdx);
        currentQuestionIndex = qIdx;
    }

    function saveSessionState() {
        if (currentSession.length === 0) return;

        const state = {
            session: currentSession.map(q => ({
                id: q.id,
                answered: collectCurrentAnswers()[currentSession.indexOf(q)].length > 0
            })),
            dpValidated: [...dpValidated],
            confidence: {...sessionConfidence},
            startTime: sessionStartTime,
            questionStartTimes: {...questionStartTimes}
        };
        localStorage.setItem('currentSessionState', JSON.stringify(state));

        if (currentUser) {
            db.collection(`users/${currentUser.uid}/metadata`).doc('currentSession').set({
                ...state,
                userId: currentUser.uid,
                syncedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(console.error);
        }
    }

    function restoreSessionState() {
        const savedState = localStorage.getItem('currentSessionState');
        if (!savedState) return false;

        try {
            const state = JSON.parse(savedState);
            const validSession = state.session.filter(q => allQcmsIndex[q.id]);
            if (validSession.length === 0) return false;

            currentSession = validSession.map(q => ({
                ...allQcmsIndex[q.id],
                options: shuffle(allQcmsIndex[q.id].options)
            }));
            dpValidated = state.dpValidated || new Array(currentSession.length).fill(false);
            sessionConfidence = state.confidence || {};
            sessionStartTime = state.startTime || Date.now();
            questionStartTimes = state.questionStartTimes || {};
            currentQuestionIndex = Object.keys(questionStartTimes).length > 0 ?
                parseInt(Object.keys(questionStartTimes)[0]) : 0;

            document.getElementById('sessionScreen').classList.remove('hidden');
            renderSessionScreen();

            if (examMode && state.startTime) {
                const elapsed = Date.now() - state.startTime;
                startExamTimer(Date.now() + (examEndTime - state.startTime - elapsed));
            }

            return true;
        } catch (e) {
            console.error("Erreur de restauration de la session :", e);
            return false;
        }
    }

    function startSession() {
        const node = getNode(currentPath);
        const canceledQCMs = getCanceledQCMs();
        const availableQcms = node.filter(q => !canceledQCMs.includes(q.id));

        if (availableQcms.length === 0) {
            alert("Aucune question disponible dans ce chapitre (toutes les questions sont annulées ou le chapitre est vide).");
            return;
        }

        const sizeInput = parseInt(document.getElementById('sessionSize').value, 10);
        let requestedSize = isNaN(sizeInput) || sizeInput < 1 ? 10 : sizeInput;
        const size = Math.min(requestedSize, availableQcms.length);

        const examModeChecked = document.getElementById('examModeToggle').checked;
        const dpModeChecked = document.getElementById('dpModeToggle').checked;
        let examDuration = null;
        if (examModeChecked) {
            const durInput = parseInt(document.getElementById('examDurationInput').value, 10);
            examDuration = isNaN(durInput) || durInput < 1 ? 30 : durInput;
        }

        document.getElementById('qcmScreen').classList.add('hidden');
        launchSession(shuffle(availableQcms).slice(0, size), {
            examMode: examModeChecked,
            dpMode: dpModeChecked,
            examDuration
        });
    }

    function launchSession(qcms, opts = {}) {
        clearExamTimer();
        examMode = !!opts.examMode;
        dpMode = !!opts.dpMode;

        sessionValidated = false;
        currentSession = qcms.map(q => ({ ...q, options: shuffle(q.options) }));
        dpValidated = new Array(currentSession.length).fill(false);
        sessionStartTime = Date.now();
        questionStartTimes = {};
        currentQuestionIndex = 0;

        for (let key in sessionConfidence) delete sessionConfidence[key];

        document.getElementById('sessionScreen').classList.remove('hidden');
        renderSessionScreen();

        if (examMode && opts.examDuration) {
            startExamTimer(Date.now() + opts.examDuration * 60000);
        } else {
            hideExamTimerWidget();
        }

        saveSessionState();
        window.scrollTo(0, 0);
    }

    function startErrorReviewSession() {
        if (!currentUser) {
            alert("Connectez-vous pour utiliser cette fonctionnalité.");
            return;
        }

        const errorLog = getErrorLog();
        const errorIds = [...new Set(Object.values(errorLog).filter(e => e.fp > 0 || e.fn > 0).map(e => e.qcmId))];
        const canceledQCMs = getCanceledQCMs();

        const qcms = errorIds
            .map(id => allQcmsIndex[id])
            .filter(q => q && !canceledQCMs.includes(q.id));

        if (qcms.length === 0) {
            alert("Aucune erreur enregistrée pour le moment, rien à réviser !");
            return;
        }

        document.getElementById('homeScreen').classList.add('hidden');
        launchSession(shuffle(qcms));
    }

    function validateFullSession() {
        Object.keys(questionStartTimes).forEach(qIdx => {
            stopQuestionTimer(parseInt(qIdx));
        });

        if (sessionValidated) return;
        sessionValidated = true;

        const answers = collectCurrentAnswers();
        let score = 0;
        const missed = [];

        currentSession.forEach((q, qIdx) => {
            const userAnswers = answers[qIdx] || [];
            const correctOptions = q.options.map((opt, i) => opt.isCorrect ? i : -1).filter(i => i !== -1);

            const isCorrect = userAnswers.length === correctOptions.length &&
                             userAnswers.every(a => correctOptions.includes(a)) &&
                             correctOptions.every(c => userAnswers.includes(c));

            if (isCorrect) score++;

            q.options.forEach((opt, oIdx) => {
                const isUserAnswer = userAnswers.includes(oIdx);
                const isCorrectOption = opt.isCorrect;

                if (isUserAnswer && !isCorrectOption) {
                    logItemResult(q.subjectPath, q.question, opt.text, 'false_positive', q.id, examMode);
                } else if (!isUserAnswer && isCorrectOption) {
                    logItemResult(q.subjectPath, q.question, opt.text, 'false_negative', q.id, examMode);
                }
            });

            if (!isCorrect) {
                missed.push({
                    q: q,
                    userAnswers: userAnswers.map(i => q.options[i].text)
                });
            }

            saveAttempt({
                qcmId: q.id,
                correct: isCorrect,
                confidence: sessionConfidence[q.id] || null,
                durationSeconds: sessionConfidence[q.id]?.duration || null,
                examMode: examMode,
                dpMode: dpMode,
                date: new Date().toISOString(),
                subjectPath: q.subjectPath
            });
        });

        const scorePercent = (score / currentSession.length * 100).toFixed(1);
        document.getElementById('sessionScreen').classList.add('hidden');
        document.getElementById('correctionScreen').classList.remove('hidden');
        document.getElementById('score').innerHTML = `
            <span class="text-${scorePercent >= 80 ? 'success' : scorePercent >= 50 ? 'warning' : 'danger'}">
                ${score} / ${currentSession.length} (${scorePercent}%)
            </span>
        `;

        const correctionDetails = document.getElementById('correctionDetails');
        correctionDetails.innerHTML = missed.map((miss, idx) => {
            const q = miss.q;
            return `
            <div class="que sngmultichoice" id="qcm-corr-block-${q.id}">
                <div class="info">
                    <h3 class="no">Question <span class="qno">${idx + 1}</span></h3>
                    <div class="grade">Noté sur 1,00</div>
                    <div class="correctness incorrect">Incorrect</div>
                </div>
                <div class="content">
                    <div class="formulation clearfix">
                        <div class="qtext">
                            <p>${escapeHTML(q.question)}</p>
                            ${q.image ? `<img src="${escapeHTML(q.image)}">` : ''}
                        </div>
                        <fieldset class="ablock">
                            <legend class="prompt">Réponse</legend>
                            <div class="answer">
                                ${q.options.map((opt, oIdx) => {
                                    const isUserAnswer = miss.userAnswers.includes(opt.text);
                                    const isCorrect = opt.isCorrect;
                                    let cls = '';
                                    if (isUserAnswer && isCorrect) cls = 'correct';
                                    else if (isUserAnswer && !isCorrect) cls = 'incorrect';
                                    else if (!isUserAnswer && isCorrect) cls = 'correctnotchecked';

                                    return `
                                    <div class="${oIdx % 2 === 0 ? 'r0' : 'r1'} ${cls}">
                                        <input type="checkbox" ${isUserAnswer ? 'checked' : ''} disabled>
                                        <label for="q${idx}_o${oIdx}" data-region="answer-label">
                                            <span class="answernumber">${String.fromCharCode(97 + oIdx)}. </span>
                                            <div class="flex-fill ml-1">
                                                <p>${escapeHTML(opt.text)} ${isCorrect ? '<i class="icon fa-solid fa-check"></i>' : ''}</p>
                                            </div>
                                        </label>
                                    </div>`;
                                }).join('')}
                            </div>
                        </fieldset>
                        <div class="outcome">
                            <i class="fa-solid fa-lightbulb"></i> La bonne réponse était :
                            ${q.options.filter(opt => opt.isCorrect).map((opt, i) => String.fromCharCode(97 + q.options.indexOf(opt))).join(', ')}
                        </div>
                    </div>
                </div>
            </div>
            `;
        }).join('');

        currentSession = [];
        dpValidated = [];
        sessionConfidence = {};
        clearExamTimer();
        localStorage.removeItem('currentSessionState');

        if (currentUser) {
            db.collection(`users/${currentUser.uid}/metadata`).doc('currentSession').delete().catch(console.error);
        }

        afterUserAction();
    }

    function displaySubjects() {
        const container = document.getElementById('subjectsList');
        container.innerHTML = '';

        const rootNode = currentPath.length === 0 ? data : getNode(currentPath);

        if (isLeaf(rootNode)) {
            currentPath.pop();
            displaySubjects();
            return;
        }

        const breadcrumb = currentPath.join(' > ');
        document.getElementById('breadcrumb').innerHTML = breadcrumb ? `
            <span onclick="backOneLevel()">Retour</span> > ${breadcrumb.split(' > ').map((p, i) =>
                `<span onclick="currentPath = currentPath.slice(0, ${i+1}); displaySubjects();">${escapeHTML(p)}</span>${i < breadcrumb.split(' > ').length - 1 ? ' > ' : ''}`
            ).join('')}
        ` : '';

        Object.entries(rootNode).forEach(([key, node]) => {
            const item = document.createElement('div');
            item.className = 'list-group-item d-flex justify-content-between align-items-center';
            item.innerHTML = `
                <div>
                    <i class="fa-solid fa-book me-2"></i>
                    <strong>${escapeHTML(key)}</strong>
                    ${isLeaf(node) ? `<span class="badge bg-info ms-2">${node.length} QCM</span>` : ''}
                </div>
                <i class="fa-solid fa-chevron-right"></i>
            `;
            item.onclick = () => {
                currentPath.push(key);
                if (isLeaf(node)) {
                    document.getElementById('chapterScreen').classList.add('hidden');
                    document.getElementById('qcmScreen').classList.remove('hidden');
                    document.getElementById('sessionChapterTitle').textContent = `Session pour : ${currentPath.join(' > ')}`;
                } else {
                    displaySubjects();
                }
            };
            container.appendChild(item);
        });
    }

                                    <small>${stats.sureRate ? 'Taux de réussite' : ''}</small>
                                </div>
                                <div class="col-4 text-center">
                                    <h6>Hésitant</h6>
                                    <h4 class="text-warning">${stats.hesitantRate || 'N/A'}%</h4>
                                    <small>${stats.hesitantRate ? 'Taux de réussite' : ''}</small>
                                </div>
                                <div class="col-4 text-center">
                                    <h6>Au hasard</h6>
                                    <h4 class="text-danger">${stats.guessRate || 'N/A'}%</h4>
                                    <small>${stats.guessRate ? 'Taux de réussite' : ''}</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    // =============================================
    // DÉMARRAGE DE L'APPLICATION
    // =============================================
    loadAllQCM();
</script>
</body>
</html>
