<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM Médecine — Interface UNESS</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
body{background:#f2f4f7;font-family:Roboto,sans-serif;font-size:.9375rem;color:#1d2125;padding-top:20px;padding-bottom:40px}
.container{max-width:1100px}.hidden{display:none!important}
.setup-card,#sessionScreen,#correctionScreen{background:#fff;border-radius:8px;border:1px solid #dee2e6}
.setup-card{padding:30px}.btn-uness{background:#1177d1;color:#fff;border:none;padding:12px 24px;border-radius:4px;text-transform:uppercase;font-weight:600;font-size:.85rem;letter-spacing:.5px}.btn-uness:hover{background:#0d5ea5;color:#fff}
.breadcrumb-nav{font-size:.85rem;color:#6c757d;margin-bottom:1rem}.breadcrumb-nav span{cursor:pointer}.breadcrumb-nav span:hover{text-decoration:underline;color:#1177d1}
#sessionScreen,#correctionScreen{padding:30px}
.exam-header{position:sticky;top:0;z-index:100;background:#fff;border:1px solid #dee2e6;border-radius:8px;padding:12px 16px;margin-bottom:18px;box-shadow:0 2px 8px #00000010}
.exam-badge{font-weight:700;letter-spacing:.04em}.timer{font-variant-numeric:tabular-nums;font-size:1.45rem;font-weight:700}.timer.warning{color:#d97706}.timer.danger{color:#c62828}
.que{clear:both;text-align:left;margin:0 auto 1.8em;border-bottom:2px solid #949494;padding-bottom:1.5em}.que:last-child{border-bottom:none}
.que .info{float:left;width:7.5em;padding:.5em;margin-bottom:1.8em;background:#f8f9fa;border:1px solid #cad0d7;border-radius:2px}.que h3.no{margin:0;font-size:.8em;line-height:1}.que span.qno{font-size:1.5em;font-weight:700}.que .info>div{font-size:.8em;margin-top:.7em}.que .content{margin:0 0 0 8.5em}.que .formulation{position:relative;padding:.5rem 0;margin-bottom:1rem;color:#1d2125;background:#fff}.accesshide{display:none!important}.que .qtext{margin-bottom:1.5em}.que .qtext p:last-child{margin-bottom:0}.que .qtext img{max-width:100%;border-radius:4px;margin-top:.5em}
.que fieldset.ablock{border:0;margin:0;padding:0}.que legend.prompt{display:none}.que .answer .r0,.que .answer .r1{display:flex;margin:.25rem 0;align-items:flex-start}.que .answer input[type=checkbox]{margin:.3rem .5rem;width:14px;flex-shrink:0}.que .answernumber{min-width:1.5em;font-weight:700}.que .answer [data-region=answer-label]{display:flex;align-items:flex-start;flex:1;cursor:pointer}.que .answer [data-region=answer-label] p{margin:0}.flex-fill{flex:1}
.que .answer .correct{background:#b2edaf;padding-bottom:5px;border-radius:2px;padding-right:5px}.que .answer .correctnotchecked{background:#cde3cd;padding-bottom:5px;border-radius:2px;padding-right:5px}.que .answer .incorrect{background:#f4b9b8;padding-bottom:5px;border-radius:2px;padding-right:5px}.que .answer .incorrectnotchecked{background:#f4b9b8;padding-bottom:5px;border-radius:2px;padding-right:5px}.que .answer .item-canceled{background:#e2e3e5;color:#6c757d;text-decoration:line-through;padding-bottom:5px;border-radius:2px;padding-right:5px}.que .answer i.icon{font-size:16px;margin-left:.4rem}.que .answer i.icon.fa-check{color:#2f7a3d}.que .answer i.icon.fa-times{color:#ca3120}
.que .correctness{display:inline-block;padding:.1em .7em;border-radius:3px;font-size:.85em;font-weight:700}.que .correctness.correct{color:#fff;background:#64a44e}.que .correctness.partiallycorrect{color:#1d2125;background:#f0ad4e}.que .correctness.incorrect,.que .correctness.notanswered{color:#fff;background:#ca3120}
.item-canceled{background:#e2e3e5;color:#6c757d;text-decoration:line-through}.dp-locked{border:1px dashed #adb5bd;background:#f8f9fa;border-radius:8px;padding:24px;text-align:center;color:#6c757d}.dp-progress{display:flex;gap:6px;flex-wrap:wrap}.dp-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;border:1px solid #ced4da;background:#fff}.dp-dot.done{background:#198754;color:#fff;border-color:#198754}.dp-dot.current{background:#1177d1;color:#fff;border-color:#1177d1}.dp-dot.locked{background:#e9ecef;color:#6c757d}
.stats-card{background:#fff;border:1px solid #dee2e6;border-radius:8px;padding:20px;height:100%}.metric{font-size:1.55rem;font-weight:700}.metric-label{font-size:.78rem;color:#6c757d}.bar{height:9px;background:#e9ecef;border-radius:10px;overflow:hidden}.bar>span{display:block;height:100%;background:#1177d1}.mini-table{font-size:.88rem}.trend-svg{width:100%;height:180px;background:#f8f9fa;border-radius:6px}
.mode-chip{font-size:.72rem}.session-options{border:1px solid #dee2e6;border-radius:8px;padding:18px;background:#fafbfc}
@media(max-width:768px){.que .info{float:none;width:100%;margin-bottom:1rem}.que .content{margin-left:0}.container{padding:0 10px}#sessionScreen,#correctionScreen,.setup-card{padding:18px}.exam-header{top:0}}
</style>
</head>
<body>
<div class="container">

<div id="homeScreen" class="setup-card shadow-sm">
    <h2 class="mb-4 text-center">🏥 QCM Médecine</h2>
    <div id="loadingScreen" class="text-center p-4"><div class="spinner-border text-primary"></div><p class="mt-2">Chargement...</p></div>
    <div class="mb-3">
        <button class="btn btn-outline-primary w-100" onclick="startErrorReviewSession()"><i class="fa-solid fa-arrow-rotate-left"></i> Réviser mes erreurs</button>
    </div>
    <div id="subjectsList" class="list-group list-group-flush mb-4"></div>
    <div class="text-center border-top pt-3 mb-3">
        <button class="btn btn-primary px-4" onclick="openStats()"><i class="fa-solid fa-chart-line"></i> Voir mes statistiques</button>
    </div>
    <div class="d-flex justify-content-between border-top pt-3 flex-wrap gap-2">
        <button class="btn btn-outline-success btn-sm" onclick="exportErrorLog()"><i class="fa-solid fa-download"></i> Exporter le Carnet d'Erreurs</button>
        <div>
            <button class="btn btn-outline-warning btn-sm me-1" onclick="resetErrorLog()"><i class="fa-solid fa-eraser"></i> Vider carnet</button>
            <button class="btn btn-outline-danger btn-sm" onclick="resetErratums()"><i class="fa-solid fa-trash-can"></i> Réinitialiser erratums</button>
        </div>
    </div>
</div>

<div id="statsScreen" class="hidden setup-card shadow-sm">
    <button class="btn btn-sm btn-outline-secondary mb-3" onclick="backToHome()">← Accueil</button>
    <h3 class="mb-4"><i class="fa-solid fa-chart-line"></i> Statistiques</h3>
    <div id="statsContent"></div>
</div>

<div id="chapterScreen" class="hidden setup-card shadow-sm">
    <button class="btn btn-sm btn-outline-secondary mb-3" onclick="backOneLevel()">← Retour</button>
    <div id="breadcrumb" class="breadcrumb-nav"></div>
    <h3 id="currentSubjectTitle" class="mb-4"></h3>
    <div id="chaptersList" class="list-group list-group-flush"></div>
</div>

<div id="qcmScreen" class="hidden setup-card shadow-sm">
    <button class="btn btn-sm btn-outline-secondary mb-3" onclick="backToChapters()">← Retour</button>
    <h4 id="sessionChapterTitle" class="text-primary mb-4"></h4>
    <div class="session-options">
        <h5 class="mb-3">Configuration de la session</h5>

        <div class="mb-3">
            <label class="form-label fw-bold">Mode</label>
            <div class="d-flex gap-2 flex-wrap">
                <input class="btn-check" type="radio" name="sessionMode" id="modeTraining" value="training" checked onchange="updateSessionOptions()">
                <label class="btn btn-outline-primary" for="modeTraining"><i class="fa-solid fa-graduation-cap"></i> Entraînement</label>
                <input class="btn-check" type="radio" name="sessionMode" id="modeExam" value="exam" onchange="updateSessionOptions()">
                <label class="btn btn-outline-danger" for="modeExam"><i class="fa-solid fa-stopwatch"></i> Mode examen</label>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Nombre de questions</label>
            <input type="number" id="sessionSize" class="form-control" value="10" min="1" style="max-width:300px">
        </div>

        <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="enableDP" onchange="updateSessionOptions()">
            <label class="form-check-label fw-bold" for="enableDP">Mode DP — validation séquentielle</label>
        </div>

        <div id="timerOptions" class="border rounded p-3 mb-3 hidden">
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" id="enableTimer" checked>
                <label class="form-check-label fw-bold" for="enableTimer">Activer le chronomètre</label>
            </div>
            <div>
                <label class="form-label mb-1">Durée de l'examen (minutes)</label>
                <input type="number" id="examDuration" class="form-control" value="30" min="1" max="600" style="max-width:200px">
            </div>
        </div>

        <div id="modeDescription" class="small text-muted mb-3"></div>
        <button class="btn btn-uness w-100" onclick="startSession()">Démarrer la série</button>
    </div>
</div>

<div id="sessionScreen" class="hidden">
    <div id="examHeader" class="exam-header hidden"></div>
    <div id="dpProgress" class="mb-3 hidden"></div>
    <div id="questionsContainer"></div>
    <div class="submitbtns text-center mt-4 mb-5" id="sessionActions"></div>
</div>

<div id="correctionScreen" class="hidden">
    <div class="setup-card text-center mb-4">
        <h2 id="score" class="text-primary"></h2>
        <div id="resultMeta" class="small text-muted mt-2"></div>
        <div class="mt-3">
            <button class="btn btn-uness me-2" onclick="backToQCMScreen()">Nouvelle session</button>
            <button class="btn btn-success" onclick="exportErrorLog()"><i class="fa-solid fa-file-export"></i> Exporter Carnet d'Erreurs</button>
        </div>
    </div>
    <div id="correctionDetails"></div>
</div>

</div>

<script>
"use strict";

let data = {};
let allQcmsIndex = {};
let currentPath = [], currentSession = [], missedAnswers = [];
let sessionValidated = false;
let sessionStartTime = null;
let timerEndTime = null;
let timerInterval = null;
let currentSessionMode = "training";
let currentSessionDP = false;
let currentSessionTimed = false;
let currentSessionDuration = null;
let currentDPIndex = 0;
let dpAnswered = {};
let dpAnswers = {};
const sessionConfidence = {};
const MAX_ATTEMPTS_LOG = 5000;

function escapeHTML(str) {
    if (!str) return "";
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}
function generateCleanId(str) {
    return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"_").replace(/_+/g,"_").slice(0,100);
}
function getCanceledQCMs(){return JSON.parse(localStorage.getItem("canceled_qcms")||"[]")}
function getCanceledItems(){return JSON.parse(localStorage.getItem("canceled_items")||"[]")}
function getErrorLog(){return JSON.parse(localStorage.getItem("digital_error_log")||"{}")}
function getAttemptsLog(){return JSON.parse(localStorage.getItem("qcm_attempts_log")||"[]")}
function saveAttempt(record){
    const log=getAttemptsLog(); log.push(record);
    if(log.length>MAX_ATTEMPTS_LOG) log.splice(0,log.length-MAX_ATTEMPTS_LOG);
    localStorage.setItem("qcm_attempts_log",JSON.stringify(log));
}
function getQcmStats(qcmId){
    const attempts=getAttemptsLog().filter(a=>a.qcmId===qcmId);
    if(!attempts.length)return{label:"Jamais vu",cls:"secondary"};
    const lastTwo=attempts.slice(-2), mastered=lastTwo.length>=2&&lastTwo.every(a=>a.correct), errors=attempts.filter(a=>!a.correct).length;
    if(mastered)return{label:"Maîtrisé",cls:"success"};
    if(errors>=2)return{label:"Erreur récurrente",cls:"danger"};
    return{label:`Vu ${attempts.length}×`,cls:"info"};
}

function setConfidence(qcmId,level){
    sessionConfidence[qcmId]=level;
    saveSessionState();
}
function logItemResult(subjectPath,qcmQuestion,itemText,status,qcmId,mode,dp){
    const log=getErrorLog(), key=`${subjectPath} > ${qcmQuestion} > ${itemText}`;
    if(!log[key]) log[key]={p:subjectPath,q:qcmQuestion,i:itemText,qcmId,fp:0,fn:0,confidence:"non spécifié",attempts:[]};
    if(status==="false_positive")log[key].fp++;
    if(status==="false_negative")log[key].fn++;
    log[key].lastMode=mode;
    log[key].lastDP=!!dp;
    if(mode==="training" && sessionConfidence[qcmId]) log[key].confidence=sessionConfidence[qcmId];
    localStorage.setItem("digital_error_log",JSON.stringify(log));
}
function recordAttemptOnItem(key,attempt){
    const log=getErrorLog();
    if(!log[key])return;
    if(!Array.isArray(log[key].attempts))log[key].attempts=[];
    log[key].attempts.push(attempt);
    if(log[key].attempts.length>30)log[key].attempts=log[key].attempts.slice(-30);
    localStorage.setItem("digital_error_log",JSON.stringify(log));
}
function cancelQCM(qcmId){
    if(!confirm("Voulez-vous annuler ce QCM ? Il ne sera plus proposé."))return;
    const c=getCanceledQCMs(); if(!c.includes(qcmId)){c.push(qcmId);localStorage.setItem("canceled_qcms",JSON.stringify(c))}
    const el=document.getElementById(`qcm-corr-block-${qcmId}`); if(el)el.remove();
}
function cancelItem(itemId){
    if(!confirm("Annuler cet ITEM ? Il sera neutralisé lors des prochaines sessions."))return;
    const c=getCanceledItems(); if(!c.includes(itemId)){c.push(itemId);localStorage.setItem("canceled_items",JSON.stringify(c))}
    alert("Item neutralisé pour les futures sessions.");
}
function resetErratums(){
    if(confirm("Réinitialiser tous les erratums enregistrés ?")){
        localStorage.removeItem("canceled_qcms");localStorage.removeItem("canceled_items");location.reload();
    }
}
function resetErrorLog(){
    if(confirm("Vider le carnet d'erreurs ET l'historique statistique ?")){
        localStorage.removeItem("digital_error_log");localStorage.removeItem("qcm_attempts_log");location.reload();
    }
}

function exportErrorLog(){
    const log=getErrorLog(), entries=Object.values(log);
    const errors=entries.filter(x=>x.fp>0||x.fn>0);
    const uncertain=entries.filter(x=>x.fp===0&&x.fn===0&&(x.confidence==="guess"||x.confidence==="hesitant"));
    if(!errors.length&&!uncertain.length){alert("Aucune donnée enregistrée dans le carnet pour le moment.");return}
    let out="PROMPT REVISION IA - CARNET D'ERREURS ET LACUNES ENRICHI\n\n";
    out+="CONSIGNE POUR L'IA :\n";
    out+="1. Priorise les erreurs commises en MODE EXAMEN.\n";
    out+="2. Identifie les erreurs récurrentes et les fausses certitudes.\n";
    out+="3. Distingue erreur de connaissance, piège de raisonnement et erreur de métacognition.\n";
    out+="4. Pour chaque notion, donne une règle de décision clinique/physiologique rapide.\n\n";
    if(errors.length){
        out+="--- ERREURS ---\n\n";
        errors.forEach(x=>{
            const exam=x.attempts?x.attempts.filter(a=>a.mode==="exam").length:0;
            out+=`• [${x.p}] ${x.q}\n  └─ Item: "${x.i}" → FP:x${x.fp}, FN:x${x.fn} | Ressenti: [${String(x.confidence||"").toUpperCase()}] | Examens: ${exam}\n\n`;
        });
    }
    if(uncertain.length){
        out+="--- BONNES REPONSES HESITANTES / AU HASARD ---\n\n";
        uncertain.forEach(x=>out+=`• [${x.p}] ${x.q}\n  └─ Item: "${x.i}" | Ressenti: [${String(x.confidence).toUpperCase()}]\n\n`);
    }
    const blob=new Blob([out],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=`carnet_erreurs_enrichi_${new Date().toISOString().slice(0,10)}.txt`;a.click();URL.revokeObjectURL(url);
}

async function loadNode(node,pathParts){
    if(Array.isArray(node)){
        const chapters={};
        for(const file of node){
            try{
                const res=await fetch(`QCM/${pathParts.join("/")}/${file}`);
                if(!res.ok)throw new Error(`HTTP ${res.status}`);
                const text=await res.text();
                const parsed=parseQCMFile(text,pathParts.join(" > "),file);
                if(parsed.length)chapters[file.replace(".txt","").replace(/_/g," ")]=parsed;
            }catch(e){console.error(`Erreur QCM/${pathParts.join("/")}/${file}`,e)}
        }
        return chapters;
    }
    const sub={};
    for(const key in node)sub[key]=await loadNode(node[key],[...pathParts,key]);
    return sub;
}
async function loadAllQCM(){
    const loading=document.getElementById("loadingScreen");
    try{
        const r=await fetch("QCM/config.json");if(!r.ok)throw new Error("Impossible de trouver config.json");
        const subjects=await r.json();
        for(const subject in subjects)data[subject]=await loadNode(subjects[subject],[subject]);
        buildFlatIndex(data);loading.classList.add("hidden");
        if(!restoreSessionState()){displaySubjects()}
    }catch(e){
        loading.innerHTML=`<div class="alert alert-danger"><h4><i class="fa-solid fa-triangle-exclamation"></i> Erreur de chargement</h4><p>Impossible de charger la base de QCM. Vérifiez votre serveur local et QCM/config.json.</p><hr><small>${escapeHTML(e.message)}</small></div>`;
    }
}
function getNode(path){let node=data;for(const key of path)node=node[key];return node}
function isLeaf(node){return Array.isArray(node)}
function buildFlatIndex(node){
    if(Array.isArray(node))node.forEach(q=>allQcmsIndex[q.id]=q);
    else Object.values(node).forEach(buildFlatIndex);
}
function parseQCMFile(content,currentSubjectPath,filename){
    const qcms=[],blocks=content.replace(/\r/g,"").split(/\n\s*\*\n+/).filter(b=>b.trim());
    blocks.forEach((block,index)=>{
        const lines=block.trim().split("\n").map(l=>l.trim()).filter(Boolean);if(lines.length<6)return;
        let question=lines[0];if(question.includes("{")||question.includes(";")||question.includes("<"))return;
        let imagePath=null,start=1;
        if(lines[1]&&lines[1].toUpperCase().startsWith("IMG:")){imagePath=lines[1].substring(4).trim();start=2}
        const options=[],regex=/^(\$?)([A-Ea-e])[\.\)]\s+(.+)$/;
        for(let i=start;i<lines.length;i++){
            const m=lines[i].match(regex);
            if(m){
                const text=m[3],id=generateCleanId(`${currentSubjectPath}_${question}_${text}`);
                options.push({id,text,isCorrect:m[1]==="$"});
            }
        }
        if(options.length===5){
            qcms.push({id:generateCleanId(`${currentSubjectPath}_${question}`),subjectPath:currentSubjectPath,question,image:imagePath,options});
        }else console.warn(`[QCM ignoré] ${filename} bloc ${index+1}: ${options.length}/5 options`);
    });
    return qcms;
}

function updateSessionOptions(){
    const exam=document.getElementById("modeExam").checked;
    document.getElementById("timerOptions").classList.toggle("hidden",!exam);
    document.getElementById("modeDescription").textContent=exam
        ?"Mode examen : aucune indication de confiance ni statut historique. Les réponses restent modifiables jusqu'à la fin. Le chrono peut soumettre automatiquement la session."
        :"Entraînement : ressenti et historique visibles. Le mode DP peut être activé indépendamment.";
}

function startSession(){
    const node=getNode(currentPath),canceled=getCanceledQCMs();
    const available=node.filter(q=>!canceled.includes(q.id));
    if(!available.length){alert("Aucune question disponible dans ce chapitre.");return}
    const n=parseInt(document.getElementById("sessionSize").value,10),size=Math.min(Number.isFinite(n)&&n>0?n:10,available.length);
    currentSessionMode=document.getElementById("modeExam").checked?"exam":"training";
    currentSessionDP=document.getElementById("enableDP").checked;
    currentSessionTimed=currentSessionMode==="exam"&&document.getElementById("enableTimer").checked;
    currentSessionDuration=currentSessionTimed?Math.max(1,parseInt(document.getElementById("examDuration").value,10)||30)*60:null;

    // Shuffle des QCM ET des items. L'ordre des items est sauvegardé dans sessionStorage.
    const chosen=shuffle(available).slice(0,size).map(q=>({...q,options:shuffle(q.options)}));
    document.getElementById("qcmScreen").classList.add("hidden");
    launchSession(chosen);
}
function startErrorReviewSession(){
    const log=getErrorLog(),ids=[...new Set(Object.values(log).filter(e=>e.fp>0||e.fn>0).map(e=>e.qcmId))],canceled=getCanceledQCMs();
    const qcms=ids.map(id=>allQcmsIndex[id]).filter(q=>q&&!canceled.includes(q.id)).map(q=>({...q,options:shuffle(q.options)}));
    if(!qcms.length){alert("Aucune erreur enregistrée pour le moment, rien à réviser !");return}
    currentSessionMode="training";currentSessionDP=false;currentSessionTimed=false;currentSessionDuration=null;
    document.getElementById("homeScreen").classList.add("hidden");launchSession(shuffle(qcms));
}
function launchSession(qcms){
    stopTimer();sessionValidated=false;currentSession=qcms;sessionStartTime=Date.now();timerEndTime=currentSessionTimed?Date.now()+currentSessionDuration*1000:null;currentDPIndex=0;dpAnswered={};dpAnswers={};
    Object.keys(sessionConfidence).forEach(k=>delete sessionConfidence[k]);
    document.getElementById("sessionScreen").classList.remove("hidden");
    renderSessionScreen();saveSessionState();window.scrollTo(0,0);
    if(currentSessionTimed)startTimer();
}

function getSelectedAnswers(qIdx){
    const q=currentSession[qIdx],selected=[];
    if(!q)return selected;
    q.options.forEach((_,oIdx)=>{const cb=document.getElementById(`q${qIdx}_o${oIdx}`);if(cb&&cb.checked)selected.push(oIdx)});
    return selected;
}
function renderDPProgress(){
    const el=document.getElementById("dpProgress");
    if(!currentSessionDP){el.classList.add("hidden");return}
    el.classList.remove("hidden");
    el.innerHTML=`<div class="small fw-bold mb-2">Progression DP — question ${currentDPIndex+1}/${currentSession.length}</div><div class="dp-progress">${currentSession.map((_,i)=>`<span class="dp-dot ${dpAnswered[i]?"done":i===currentDPIndex?"current":"locked"}">${i+1}</span>`).join("")}</div>`;
}
function renderSessionHeader(){
    const h=document.getElementById("examHeader");
    if(currentSessionMode!=="exam"){h.classList.add("hidden");return}
    h.classList.remove("hidden");

}

                            <input type="radio" class="btn-check" name="conf_${qIdx}" id="conf_mid_${qIdx}" onchange="setConfidence('${q.id}','hesitant')"><label class="btn btn-outline-warning" for="conf_mid_${qIdx}">Hésitant</label>
                            <input type="radio" class="btn-check" name="conf_${qIdx}" id="conf_low_${qIdx}" onchange="setConfidence('${q.id}','guess')"><label class="btn btn-outline-danger" for="conf_low_${qIdx}">Au hasard</label>

function renderSessionActions(){
    const a=document.getElementById("sessionActions");
    if(currentSessionDP){
        const isLast=currentDPIndex===currentSession.length-1;
        a.innerHTML=`<button class="btn btn-primary px-4" onclick="validateDPQuestion()">${isLast?"Terminer et corriger":"Valider la question et continuer"} <i class="fa-solid fa-arrow-right"></i></button>`;
    }else{
        a.innerHTML=`<button class="btn btn-primary px-4" onclick="validateFullSession(false)">Terminer le test</button>`;
    }
}
function validateDPQuestion(){
    if(sessionValidated)return;
    const answers=getSelectedAnswers(currentDPIndex);
    if(answers.length===0&&!confirm("Aucune réponse sélectionnée. Valider quand même cette question ?"))return;
    dpAnswers[currentDPIndex]=answers;
    dpAnswered[currentDPIndex]=true;
    saveSessionState();
    if(currentDPIndex<currentSession.length-1){currentDPIndex++;renderSessionScreen();saveSessionState();window.scrollTo(0,0)}
    else validateFullSession(false);
}

function startTimer(){
    stopTimer();updateTimer();
    timerInterval=setInterval(updateTimer,250);
}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}
function updateTimer(){
    if(!currentSessionTimed||sessionValidated)return;
    const remaining=Math.max(0,timerEndTime-Date.now()),seconds=Math.ceil(remaining/1000);
    const m=Math.floor(seconds/60),s=seconds%60,el=document.getElementById("timerDisplay");
    if(el){el.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;el.className=`timer ${seconds<=60?"danger":seconds<=300?"warning":""}`}
    if(remaining<=0){stopTimer();validateFullSession(true)}
}

function saveSessionState(){
    if(!currentSession.length||sessionValidated)return;
    const userAnswers={};
    currentSession.forEach((q,qIdx)=>{
        if(currentSessionDP && Object.prototype.hasOwnProperty.call(dpAnswers,qIdx)){
            userAnswers[qIdx]=dpAnswers[qIdx];
        }else{
            userAnswers[qIdx]=getSelectedAnswers(qIdx);
        }
    });
    const state={
        currentPath,currentSession,startTime:sessionStartTime,mode:currentSessionMode,
        dp:currentSessionDP,timed:currentSessionTimed,duration:currentSessionDuration,
        endTime:timerEndTime,currentDPIndex,dpAnswered,dpAnswers,
        confidence:{...sessionConfidence},userAnswers
    };
    sessionStorage.setItem("active_qcm_session",JSON.stringify(state));
}
function clearSessionState(){sessionStorage.removeItem("active_qcm_session")}
function restoreSessionState(){
    const raw=sessionStorage.getItem("active_qcm_session");if(!raw)return false;
    try{
        const state=JSON.parse(raw);if(!state.currentSession?.length)return false;
        currentPath=state.currentPath||[];currentSession=state.currentSession;sessionStartTime=state.startTime||Date.now();
        currentSessionMode=state.mode||"training";currentSessionDP=!!state.dp;currentSessionTimed=!!state.timed;currentSessionDuration=state.duration||null;timerEndTime=state.endTime||null;currentDPIndex=state.currentDPIndex||0;dpAnswered=state.dpAnswered||{};dpAnswers=state.dpAnswers||state.userAnswers||{};
        Object.keys(sessionConfidence).forEach(k=>delete sessionConfidence[k]);Object.assign(sessionConfidence,state.confidence||{});
        ["homeScreen","chapterScreen","qcmScreen","statsScreen"].forEach(id=>document.getElementById(id).classList.add("hidden"));
        document.getElementById("sessionScreen").classList.remove("hidden");
        renderSessionScreen(state);
        if(currentSessionTimed){if(Date.now()>=timerEndTime)validateFullSession(true);else startTimer()}
        return true;
    }catch(e){console.error(e);clearSessionState();return false}
}

function validateFullSession(autoSubmitted){
    if(sessionValidated)return;
    sessionValidated=true;stopTimer();
    let score=0,validCount=0;missedAnswers=[];
    const details=document.getElementById("correctionDetails"),canceled=getCanceledItems(),attemptDate=new Date().toISOString();
    details.innerHTML="";
    const duration=sessionStartTime?Math.round((Date.now()-sessionStartTime)/1000):null;
    currentSession.forEach((q,qIdx)=>{
        const userChoices=currentSessionDP&&dpAnswered[qIdx]?getSavedAnswersFromState(qIdx):getSelectedAnswers(qIdx);
        let errors=0,active=0;
        q.options.forEach((opt,oIdx)=>{
            if(canceled.includes(opt.id))return;
            active++;
            const checked=userChoices.includes(oIdx);
            if(opt.isCorrect&&!checked){errors++;logItemResult(q.subjectPath,q.question,opt.text,"false_negative",q.id,currentSessionMode,currentSessionDP)}
            else if(!opt.isCorrect&&checked){errors++;logItemResult(q.subjectPath,q.question,opt.text,"false_positive",q.id,currentSessionMode,currentSessionDP)}
        });
        let qScore=0;
        if(active){validCount++;if(errors===0)qScore=1;else if(errors===1)qScore=.5;else if(errors===2)qScore=.2}
        score+=qScore;
        if(active){
            saveAttempt({date:attemptDate,qcmId:q.id,subjectPath:q.subjectPath,correct:errors===0,score:qScore,confidence:currentSessionMode==="training"?(sessionConfidence[q.id]||null):null,durationSeconds:duration?Math.round(duration/currentSession.length):null,mode:currentSessionMode,dp:currentSessionDP,timed:currentSessionTimed,examDurationSeconds:currentSessionDuration,autoSubmitted:!!autoSubmitted});
        }
        const correctnessClass=active===0?"notanswered":errors===0?"correct":userChoices.length===0?"notanswered":qScore>0?"partiallycorrect":"incorrect";
        const correctnessLabel=active===0?"Question neutralisée (100% annulée)":errors===0?"Correct":userChoices.length===0?"Pas de réponse":qScore>0?"Partiellement correct":"Incorrect";
        const optHtml=q.options.map((opt,oIdx)=>{
            const checked=userChoices.includes(oIdx),isCanceled=canceled.includes(opt.id);let cls="",icon="";
            if(isCanceled){cls="item-canceled";icon='<span class="badge bg-secondary ms-2">Item annulé</span>'}
            else if(opt.isCorrect&&checked){cls="correct";icon='<i class="icon fa-solid fa-check"></i>'}
            else if(opt.isCorrect&&!checked){cls="correctnotchecked";icon='<i class="icon fa-solid fa-check"></i>';missedAnswers.push({q:q.question,a:opt.text})}
            else if(!opt.isCorrect&&checked){cls="incorrect";icon='<i class="icon fa-solid fa-times"></i>'}
            else cls="incorrectnotchecked";
            return `<div class="${oIdx%2===0?"r0":"r1"} align-items-center">
                <input type="checkbox" disabled ${checked?"checked":""}>
                <label data-region="answer-label" class="${cls}"><span class="answernumber">${String.fromCharCode(97+oIdx)}. </span><div class="flex-fill"><p>${escapeHTML(opt.text)}</p></div>${icon}</label>
                ${!isCanceled?`<button class="btn btn-outline-warning btn-sm p-1 ms-2" style="font-size:.75rem" onclick="cancelItem('${opt.id.replace(/'/g,"\\'")}')"><i class="fa-solid fa-ban"></i> Annuler item</button>`:""}
            </div>`;
        }).join("");
        const stats=getQcmStats(q.id),note=qScore.toFixed(2).replace(".",","),modeLabel=currentSessionMode==="exam"?"MODE EXAMEN":"ENTRAÎNEMENT";
        details.innerHTML+=`<div class="que ${correctnessClass}" id="qcm-corr-block-${q.id}">
            <div class="info"><h3 class="no">Question <span class="qno">${qIdx+1}</span></h3><div class="state"><span class="correctness ${correctnessClass}">${correctnessLabel}</span></div><div class="grade">Note : ${note} / 1,00</div><div><span class="badge bg-${stats.cls}">${stats.label}</span></div><div><span class="badge ${currentSessionMode==="exam"?"bg-danger":"bg-primary"} mode-chip">${modeLabel}</span>${currentSessionDP?'<span class="badge bg-secondary mode-chip ms-1">DP</span>':""}</div><button class="btn btn-outline-danger btn-sm mt-3 w-100" style="font-size:.7rem" onclick="cancelQCM('${q.id.replace(/'/g,"\\'")}')"><i class="fa-solid fa-ban"></i> Signaler Erratum QCM</button></div>
            <div class="content"><div class="formulation"><div class="qtext"><p>${escapeHTML(q.question)}</p>${q.image?`<img src="${escapeHTML(q.image)}">`:""}</div><fieldset class="ablock"><div class="answer">${optHtml}</div></fieldset></div>
            ${currentSessionMode==="exam"?'<div class="alert alert-danger py-2"><strong>Réalisé en mode examen.</strong> Toute erreur commise dans ce contexte est conservée comme erreur d’examen.</div>':""}
            ${currentSessionMode==="training"?`<div class="small text-muted border-top pt-2">Ressenti : ${({sure:"Sûr",hesitant:"Hésitant",guess:"Au hasard"}[sessionConfidence[q.id]]||"non renseigné")}</div>`:""}
            </div></div>`;
        q.options.forEach(opt=>{
            const key=`${q.subjectPath} > ${q.question} > ${opt.text}`;
            if(getErrorLog()[key])recordAttemptOnItem(key,{date:attemptDate,mode:currentSessionMode,dp:currentSessionDP,correct:errors===0});
        });
    });
    document.getElementById("sessionScreen").classList.add("hidden");document.getElementById("correctionScreen").classList.remove("hidden");
    const denom=validCount||1,score20=(score/denom*20).toFixed(2).replace(".",",");
    document.getElementById("score").textContent=`Résultat : ${score20} / 20 ${validCount<currentSession.length?`(${currentSession.length-validCount} QCM neutralisé)`:""}`;
    document.getElementById("resultMeta").textContent=`${currentSessionMode==="exam"?"Mode examen":"Entraînement"}${currentSessionDP?" • DP":""}${autoSubmitted?" • Soumission automatique à l'expiration du chrono":""}`;
    clearSessionState();window.scrollTo(0,0);
}
function getSavedAnswersFromState(qIdx){
    try{const s=JSON.parse(sessionStorage.getItem("active_qcm_session")||"{}");return s.userAnswers?.[qIdx]||[]}catch{return []}
}

/* ---------------- STATISTIQUES ---------------- */

function computeStats(){
    const attempts=getAttemptsLog(),now=Date.now();
    const total=attempts.length,correct=attempts.filter(a=>a.correct).length;
    const exam=attempts.filter(a=>a.mode==="exam"),training=attempts.filter(a=>a.mode!=="exam"),dp=attempts.filter(a=>a.dp);
    const avg=arr=>arr.length?arr.reduce((s,a)=>s+(Number(a.score)||0),0)/arr.length:null;
    const avgTime=arr=>{const x=arr.map(a=>a.durationSeconds).filter(Number.isFinite);return x.length?x.reduce((s,v)=>s+v,0)/x.length:null};
    const byMode=(arr)=>({n:arr.length,rate:arr.length?arr.filter(a=>a.correct).length/arr.length*100:null,score:avg(arr),time:avgTime(arr)});
    const bySubject={};
    attempts.forEach(a=>{const subject=(a.subjectPath||"Inconnu").split(" > ")[0];(bySubject[subject]??=[]).push(a)});
    const byChapter={};
    attempts.forEach(a=>{const subject=a.subjectPath||"Inconnu";(byChapter[subject]??=[]).push(a)});
    const errors=Object.values(getErrorLog()).filter(e=>e.fp>0||e.fn>0);
    const falseCertainty=attempts.filter(a=>a.confidence==="sure"&&!a.correct).length;
    const conf={sure:attempts.filter(a=>a.confidence==="sure"),hesitant:attempts.filter(a=>a.confidence==="hesitant"),guess:attempts.filter(a=>a.confidence==="guess")};
    const timeBuckets={"< 20 s":[],"20–40 s":[],"40–60 s":[],"60–90 s":[ ],"> 90 s":[]};
    attempts.forEach(a=>{const t=a.durationSeconds;if(!Number.isFinite(t))return;if(t<20)timeBuckets["< 20 s"].push(a);else if(t<40)timeBuckets["20–40 s"].push(a);else if(t<60)timeBuckets["40–60 s"].push(a);else if(t<90)timeBuckets["60–90 s"].push(a);else timeBuckets["> 90 s"].push(a)});
    const last30=attempts.slice(-30);
    return {attempts,total,correct,rate:total?correct/total*100:0,exam:byMode(exam),training:byMode(training),dp:byMode(dp),bySubject,byChapter,errors,falseCertainty,conf,timeBuckets,last30,now};
}
function pct(n){return n==null?"—":`${n.toFixed(1)} %`}
function fmtSec(n){return n==null?"—":`${Math.round(n)} s`}
function statRow(name,arr){
    const n=arr.length,r=n?arr.filter(a=>a.correct).length/n*100:0,score=n?arr.reduce((s,a)=>s+a.score,0)/n:0;
    return `<tr><td>${escapeHTML(name)}</td><td>${n}</td><td>${pct(r)}</td><td>${score.toFixed(2)}/1</td><td>${fmtSec(arr.map(a=>a.durationSeconds).filter(Number.isFinite).reduce((a,b)=>a+b,0)/(arr.filter(a=>Number.isFinite(a.durationSeconds)).length||1))}</td></tr>`;
}
function renderTrend(arr){
    if(arr.length<2)return `<div class="text-muted small p-3">Pas encore assez de données pour afficher une évolution.</div>`;
    const vals=arr.map(a=>(a.score||0)*20),w=700,h=170,p=18,max=20,min=0;
    const pts=vals.map((v,i)=>`${p+i*(w-2*p)/(vals.length-1)},${h-p-(v-min)/(max-min)*(h-2*p)}`).join(" ");
    return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#1177d1" stroke-width="3"/><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#ced4da"/><line x1="${p}" y1="${p}" x2="${p}" y2="${h-p}" stroke="#ced4da"/></svg>`;
}
function openStats(){
    document.getElementById("homeScreen").classList.add("hidden");document.getElementById("statsScreen").classList.remove("hidden");renderStats();window.scrollTo(0,0);
}
function renderStats(){
    const s=computeStats(),el=document.getElementById("statsContent");
    if(!s.total){el.innerHTML=`<div class="alert alert-info">Aucune tentative enregistrée. Commence une série pour alimenter les statistiques.</div>`;return}
    const subjectRows=Object.entries(s.bySubject).sort((a,b)=>b[1].length-a[1].length).map(([k,v])=>statRow(k,v)).join("");
    const errorRows=s.errors.sort((a,b)=>(b.fp+b.fn)-(a.fp+a.fn)).slice(0,10).map(e=>`<tr><td>${escapeHTML(e.p)}</td><td>${escapeHTML(e.i)}</td><td>${e.fp+e.fn}</td><td>${e.attempts?.filter(a=>a.mode==="exam").length||0}</td></tr>`).join("");
    const confRows=["sure","hesitant","guess"].map(k=>{const a=s.conf[k],r=a.length?a.filter(x=>x.correct).length/a.length*100:null;return `<tr><td>${k==="sure"?"Sûr":k==="hesitant"?"Hésitant":"Au hasard"}</td><td>${a.length}</td><td>${pct(r)}</td></tr>`}).join("");
    const timeRows=Object.entries(s.timeBuckets).map(([k,v])=>`<tr><td>${k}</td><td>${v.length}</td><td>${pct(v.length?v.filter(a=>a.correct).length/v.length*100:null)}</td></tr>`).join("");
    el.innerHTML=`
    <div class="row g-3 mb-3">
        <div class="col-6 col-lg-3"><div class="stats-card"><div class="metric">${s.total}</div><div class="metric-label">QCM réalisés</div></div></div>
        <div class="col-6 col-lg-3"><div class="stats-card"><div class="metric">${pct(s.rate)}</div><div class="metric-label">Taux de réussite</div></div></div>
        <div class="col-6 col-lg-3"><div class="stats-card"><div class="metric">${s.falseCertainty}</div><div class="metric-label">Fausses certitudes</div></div></div>
        <div class="col-6 col-lg-3"><div class="stats-card"><div class="metric">${s.errors.length}</div><div class="metric-label">Notions avec erreurs</div></div></div>
    </div>
    <div class="stats-card mb-3"><h5>Performance par mode</h5><div class="table-responsive"><table class="table table-sm mini-table"><thead><tr><th>Mode</th><th>QCM</th><th>Réussite</th><th>Score moyen</th><th>Temps moyen</th></tr></thead><tbody>
        ${statRow("Entraînement",s.training.n?attemptsForMode(s.attempts,"training"):[])}
        ${statRow("Examen",s.exam.n?attemptsForMode(s.attempts,"exam"):[])}
        ${statRow("DP",s.attempts.filter(a=>a.dp))}
    </tbody></table></div></div>
    <div class="row g-3 mb-3">
        <div class="col-lg-6"><div class="stats-card"><h5>Métacognition</h5><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Ressenti</th><th>N</th><th>Réussite</th></tr></thead><tbody>${confRows}</tbody></table></div></div></div>
        <div class="col-lg-6"><div class="stats-card"><h5>Temps de réponse</h5><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Temps</th><th>N</th><th>Réussite</th></tr></thead><tbody>${timeRows}</tbody></table></div></div></div>
    </div>
    <div class="stats-card mb-3"><h5>Performance par matière</h5><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Matière</th><th>QCM</th><th>Réussite</th><th>Score</th><th>Temps</th></tr></thead><tbody>${subjectRows}</tbody></table></div></div>
    <div class="stats-card mb-3"><h5>Évolution récente du score</h5>${renderTrend(s.last30)}</div>
    <div class="row g-3">
        <div class="col-lg-8"><div class="stats-card"><h5>Top erreurs récurrentes</h5><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Matière</th><th>Item</th><th>Erreurs</th><th>Examens</th></tr></thead><tbody>${errorRows||'<tr><td colspan="4" class="text-muted">Aucune erreur enregistrée.</td></tr>'}</tbody></table></div></div></div>
        <div class="col-lg-4"><div class="stats-card"><h5>Répartition</h5><p class="mb-1">Examen</p><div class="bar mb-3"><span style="width:${s.total?s.exam.n/s.total*100:0}%"></span></div><p class="mb-1">DP</p><div class="bar mb-3"><span style="width:${s.total?s.dp.n/s.total*100:0}%"></span></div><p class="small text-muted mb-0">Les erreurs commises en examen sont conservées avec leur contexte pour être prioritaires dans le carnet.</p></div></div>
    </div>`;
}
function attemptsForMode(attempts,mode){return attempts.filter(a=>mode==="training"?a.mode!=="exam":a.mode===mode)}

loadAllQCM();
updateSessionOptions();
